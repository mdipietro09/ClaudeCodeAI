<script>
(() => {
 'use strict';
 const data=JSON.parse(document.getElementById('forecast-data').textContent),panel=document.getElementById('details');
 const buttons=Array.from(document.querySelectorAll('.scenario'));let active=null,pinned=false,drag=null,suppressClickUntil=0;
 function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value)e.textContent=value;return e;}
 function place(x,y){const r=panel.getBoundingClientRect();const left=x+20+r.width>innerWidth-12?x-r.width-20:x+20;panel.style.left=Math.max(12,Math.min(left,innerWidth-r.width-12))+'px';panel.style.top=Math.max(12,Math.min(y-25,innerHeight-r.height-12))+'px';}
 function close(){pinned=false;active=null;panel.hidden=true;buttons.forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-expanded','false');});}
 function show(s,b,event,pin=false){
  if(drag||performance.now()<suppressClickUntil||(pinned&&!pin))return;

  panel.append(el('div','eyebrow',s.parent+' / scenario'),el('h1',null,s.label));
  const probability=el('div','prob',s.probability===null?'TBD':`${Number((s.probability*100).toFixed(1))}%`);probability.append(el('small',null,s.probability===null?'not yet estimated':s.parent==='War'?'conditional estimate':'subjective estimate'));panel.append(probability,el('p',null,s.definition),el('p',null,s.reason));

 for(const [id,parent] of [['midterm','Midterm'],['war','War'],['election','Election'],['china-taiwan-topic','Taiwan'],['china-oil-topic','Oil']]){

  topic.addEventListener('blur',()=>{focused=false;update();});

  root.addEventListener('blur',()=>{focused=false;update();});

 const handles=[...document.querySelectorAll('.country,.topic,.scenario')];
 function targetFor(handle){return handle.closest('#us-cluster,#israel-cluster,#china-cluster');}
 for(const handle of handles){const target=targetFor(handle);if(!motions.has(target))motions.set(target,{x:0,y:0,baseX:0,baseY:0});handle.setAttribute('aria-label',handle.getAttribute('aria-label')+'. Drag to move the entire country group; arrow keys also move the group, Shift for larger steps.');}
 function apply(target){const m=motions.get(target);target.setAttribute('transform',`translate(${m.baseX+m.x},${m.baseY+m.y})`);}
 function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(world.getScreenCTM().inverse());}
 world.addEventListener('pointerdown',e=>{
  if(drag||e.button!==0||!e.isPrimary)return;

  close();handle.setPointerCapture(e.pointerId);e.preventDefault();

  if(!drag||e.pointerId!==drag.pointer)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.screenX,e.clientY-drag.screenY)<4)return;
  drag.moved=true;world.classList.add('dragging');
  const current=point(e),m=motions.get(drag.target);m.x=drag.x+current.x-drag.start.x;m.y=drag.y+current.y-drag.start.y;apply(drag.target);e.preventDefault();
 });
 function finish(e){
  if(!drag||e.pointerId!==drag.pointer)return;
  const {moved,handle}=drag;drag=null;world.classList.remove('dragging');if(moved)suppressClickUntil=performance.now()+350;

 }

  const direction={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!direction)return;

 });

 function layout(){for(const [id,x,y] of [['israel',-640,510],['china',-1280,1020]]){const cluster=document.getElementById(id+'-cluster'),m=motions.get(cluster);m.baseX=narrow.matches?x:0;m.baseY=narrow.matches?y:0;apply(cluster);}world.setAttribute('viewBox',narrow.matches?'180 65 650 1600':'180 65 1950 570');}
 narrow.addEventListener('change',layout);layout();
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.scenario,#details'))close();});window.addEventListener('resize',close);
})();
