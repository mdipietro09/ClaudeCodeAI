<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OIL</title>
<style>
  :root{
    --bg:#000000; --fg:#f0efec; --sub:#a3a29c; --panel:#161615; --panel-border:#3a3a37;
    --land:#262623; --land-stroke:#4a4944; --chip-bg:#161615;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:24px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:0.06em; margin:0 0 14px; }

  .type-toggle { display:inline-flex; gap:4px; padding:4px; border-radius:9px; background:var(--panel); border:1px solid var(--panel-border); margin-bottom:20px; }
  .type-btn {
    font:inherit; font-size:12px; font-weight:600; letter-spacing:0.04em; color:var(--sub);
    background:none; border:none; padding:7px 16px; border-radius:6px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .type-btn:hover { color:var(--fg); }
  .type-btn.active { background:var(--fg); color:#000; }

  .wrap { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .map-col { flex:1 1 auto; min-width:0; }
  .map { width:100%; position:relative; }
  svg { width:100%; height:auto; display:block; }

  .legend { display:flex; flex-direction:column; gap:2px; margin-top:14px; font-size:12.5px; color:var(--sub); flex:0 0 260px; }
  .legend-item {
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    cursor:pointer; user-select:none; transition:background .15s ease;
  }
  .legend-item:hover { background: rgba(127,127,127,0.12); }
  .legend-item.dimmed { opacity:0.35; }
  .legend-header { padding:0 8px; margin:0 0 8px; }
  .legend-title { display:block; font-size:13px; font-weight:700; color:var(--fg); letter-spacing:0.03em; margin:0 0 2px; }
  .legend .sw { width:12px; height:12px; flex:0 0 12px; display:inline-block; border-radius:3px; }
  .legend b { color:var(--fg); font-weight:600; }
  .legend-hint { display:block; font-size:8.5px; line-height:1.2; color:var(--sub); }
  .line-key { margin-top:14px; padding:10px 8px 0; border-top:1px solid var(--panel-border); }
  .line-key-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .line-key-row svg { width:28px; height:8px; flex:0 0 28px; }

  .country { transition: filter .15s ease, opacity .15s ease; cursor:pointer; }
  .country.faded { opacity:0.25; }
  .country.hovered { filter: brightness(1.18); }
  .country.selected { stroke:#ffffff; }

  /* Zoom: --k is the current zoom level, set on each map's <svg>. Dividing
     line widths / dashes by it keeps them the same size on screen while
     the map itself magnifies (arrowheads follow the stroke width). */
  .country { stroke-width: calc(1px / var(--k, 1)); }
  .country.selected { stroke-width: calc(1.6px / var(--k, 1)); }
  .route { stroke-width: calc(1.7px / var(--k, 1)); }
  .route.dashed { stroke-dasharray: calc(4px / var(--k, 1)) calc(3px / var(--k, 1)); }

  .route { transition: opacity .15s ease; cursor:pointer; }
  .route.faded { opacity:0.08 !important; }
  .route.hovered { stroke-width: calc(3.4px / var(--k, 1)) !important; }

  .map svg { cursor: grab; }
  .map svg:active { cursor: grabbing; }
  .zoom-controls { position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; }
  .zoom-controls button {
    width:28px; height:28px; padding:0; font:inherit; font-size:16px; line-height:1; color:var(--fg);
    background:var(--panel); border:1px solid var(--panel-border); border-radius:6px; cursor:pointer;
  }
  .zoom-controls button:hover { background:#252523; }

  .glow { pointer-events:none; }
  .chokepoint-halo { pointer-events:none; }
  .chokepoint.faded, .chokepoint-halo.faded { opacity:0.3; }
  path.chokepoint.selected { stroke:#ffffff; stroke-width:calc(2px / var(--k, 1)); }
  .chokepoint { cursor:pointer; }
  .chokepoint:hover { filter: brightness(1.4); }

  .label-text { pointer-events:none; }

  /* FIELDS view markers */
  .field { cursor:pointer; transition: opacity .15s ease; }
  .field.hovered { stroke:#ffffff; }
  .field.faded { opacity:0.1; }
  .field.selected { stroke:#ffffff; stroke-width:calc(2px / var(--k, 1)) !important; }
  /* The legend is exactly as tall as the map: "contain:size" stops its
     content from growing the row, so the map sets the height and the
     legend stretches to it; the company list scrolls inside. */
  .fields-legend { margin-top:0; align-self:stretch; contain:size; }
  @media (max-width: 760px) { .fields-legend { contain:none; align-self:auto; max-height:70vh; } }
  .fields-legend .company-list { flex:1 1 auto; min-height:0; overflow-y:auto; margin-right:-6px; padding-right:6px; }
  .fields-legend .legend-item { align-items:flex-start; line-height:1.35; }
  .fields-legend .legend-item .sw { margin-top:3px; }
  .fields-legend .tag { font-size:9.5px; padding:0 4px; border-radius:3px; border:1px solid var(--panel-border); color:var(--sub); white-space:nowrap; }

  #tooltip {
    position:fixed; z-index:50; pointer-events:none; max-width:300px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 12px; font-size:12.5px; line-height:1.45; color:var(--fg);
    box-shadow:0 6px 24px rgba(0,0,0,0.18); opacity:0; transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
  }
  #tooltip.show { opacity:1; transform:translateY(0); }
  #tooltip .tt-title { font-weight:600; margin-bottom:3px; display:flex; align-items:center; gap:6px; }
  #tooltip .tt-dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:0 0 9px; }
  #tooltip .tt-body { color:var(--sub); }
  #tooltip .tt-body b { color:var(--fg); }

  footer { margin-top:18px; font-size:11.5px; color:var(--sub); max-width:760px; }
</style>
</head>
<body>
<h1>OIL MAP</h1>
<div class="type-toggle" id="typeToggle">
  <button class="type-btn active" data-type="crude">CRUDE</button>
  <button class="type-btn" data-type="refined">REFINED</button>
  <button class="type-btn" data-type="fields">FIELDS</button>
</div>

<!-- CRUDE view — rendered only by the CRUDE script below -->
<div class="view" id="crudeView">
  <div class="wrap">
    <div class="map-col"><div class="map" id="crudeMap"></div></div>
    <div class="legend" id="crudeLegend"></div>
  </div>
</div>

<!-- REFINED view — rendered only by the REFINED script below -->
<div class="view" id="refinedView" hidden>
  <div class="wrap">
    <div class="map-col"><div class="map" id="refinedMap"></div></div>
    <div class="legend" id="refinedLegend"></div>
  </div>
</div>

<!-- FIELDS view — rendered only by the FIELDS script below -->
<div class="view" id="fieldsView" hidden>
  <div class="wrap">
    <div class="map-col"><div class="map" id="fieldsMap"></div></div>
    <div class="legend" id="fieldsLegend"></div>
  </div>
</div>

<div id="tooltip"></div>

<footer>Data as of ~Sept 2026, see <code>crude.xlsx</code>, <code>refined.xlsx</code> and <code>fields.xlsx</code> for full sourcing, percentages, and routing notes behind every figure shown here.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
/* ============================================================
   CRUDE / REFINED / FIELDS TOGGLE — the only code shared by the views.
   It just shows one view and hides the others; each view's data and
   rendering live in their own independent script block below.
   ============================================================ */
d3.selectAll('.type-btn').on('click', function(){
  const type = this.dataset.type;
  d3.selectAll('.type-btn').classed('active', false);
  d3.select(this).classed('active', true);
  d3.select('#crudeView').attr('hidden', type === 'crude' ? null : true);
  d3.select('#refinedView').attr('hidden', type === 'refined' ? null : true);
  d3.select('#fieldsView').attr('hidden', type === 'fields' ? null : true);
  d3.select('#tooltip').classed('show', false);
});
</script>

<script>
/* ############################################################

   Wrapped in an IIFE so nothing leaks into / collides with REFINED.
   ############################################################ */
(function(){
/* ============================================================

function diamond(c, s){ const p=pt(c); return `M${p[0]},${p[1]-s}L${p[0]+s},${p[1]}L${p[0]},${p[1]+s}L${p[0]-s},${p[1]}Z`; }
function routeColor(d){ return d.group ? groupByKey[d.group].color : '#a3a29c'; }
function curvePath(points, bend){
  const p = points.map(pt);
  let d = 'M'+p[0][0]+','+p[0][1];
  for (let i=1;i<p.length;i++){
    const mx=(p[i-1][0]+p[i][0])/2, my=(p[i-1][1]+p[i][1])/2 - bend;
    d += ' Q'+mx+','+my+' '+p[i][0]+','+p[i][1];
  }
  return d;
}

// ---- tooltip ----
const tooltip = d3.select('#tooltip');
function showTooltip(event, titleHtml, dotColor, bodyHtml){
  tooltip.html(
    '<div class="tt-title">' + (dotColor ? '<span class="tt-dot" style="background:'+dotColor+'"></span>' : '') + titleHtml + '</div>' +
    '<div class="tt-body">' + bodyHtml + '</div>'
  );
  moveTooltip(event);
  tooltip.classed('show', true);
}
function moveTooltip(event){
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ttNode = tooltip.node();
  const w = ttNode.offsetWidth || 240, h = ttNode.offsetHeight || 60;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + w + pad > vw) x = event.clientX - w - pad;
  if (y + h + pad > vh) y = event.clientY - h - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}
function hideTooltip(){ tooltip.classed('show', false); }

function formatStatLine(pct, place){
  return '<b>' + pct + '%</b> ' + place;
}
function formatCountryStats(info){
  const exportsPct = info.exports.reduce((s,e)=>s+e.pct, 0);
  const importsPct = info.imports.reduce((s,e)=>s+e.pct, 0);
  return (
    '<div style="margin-top:4px"><b>Export</b> (' + Math.round(exportsPct) + '%)<br>' +
      info.exports.map(e => formatStatLine(e.pct, e.to)).join('<br>') + '</div>' +
    '<div style="margin-top:4px"><b>Import</b> (' + Math.round(importsPct) + '%)<br>' +
      info.imports.map(e => formatStatLine(e.pct, e.from)).join('<br>') + '</div>'
  );
}

function showEuTooltip(event){
  showTooltip(event, euHub.name, '#e0ded4',
    euHub.note +
    formatCountryStats({exports:[{to:'None',pct:0}], imports:euHub.imports}));
}

// ---- legend state (click to isolate a group) ----
let activeGroup = null;   // null = show all
let activeRoute = null;   // a single clicked arrow; null = none
let activeCountry = null; // a countryInfo name or 'EU'; null = none
let activeChoke = null;   // a clicked chokepoint; null = none

// Routes passing through a chokepoint: a waypoint sits on it, or the route
// lists it in via[] (for arrows that pass it without a waypoint there).
function routesThrough(cp){
  return routes.filter(r => (r.via || []).includes(cp.name) ||
    r.pts.some(p => Math.abs(p[0]-cp.c[0]) <= 1.1 && Math.abs(p[1]-cp.c[1]) <= 1.1));
}
// Click a chokepoint: isolate every arrow through it (minor ones included)
// and the countries at both ends. Click it again (or the sea) to reset.
function selectChoke(cp){
  activeChoke = (activeChoke === cp) ? null : cp;
  activeCountry = null;
  activeGroup = null;
  activeRoute = null;
  applyFocus();
}

// Which clickable "entity" a topology country belongs to (EU members → 'EU').
function entityOf(n){ return euMemberCountries.has(n) ? 'EU' : (countryInfo[n] ? n : null); }
// Click a country: isolate it and every arrow into / out of it. Click it
// again (or the sea, or an untracked country) to reset.
function selectCountry(e){
  activeCountry = (e && activeCountry !== e) ? e : null;
  activeGroup = null;
  activeRoute = null;
  activeChoke = null;
  applyFocus();
}

// Click an arrow: isolate it and the countries at its two ends. Click it
// again (or the sea) to reset.
function selectRoute(r){
  activeRoute = (activeRoute === r) ? null : r;
  activeCountry = null;
  activeGroup = null;
  activeChoke = null;
  applyFocus();
}

function applyFocus(){
  svg.selectAll('.chokepoint-halo, path.chokepoint')
    .classed('faded', d => activeChoke ? d !== activeChoke : false)
    .classed('selected', d => d === activeChoke);
  if (activeChoke){
    const linked = routesThrough(activeChoke);
    const keep = new Set();
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => keep.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => !linked.includes(d))
      .style('display', d => (d.minor && !linked.includes(d)) ? 'none' : null);
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeRoute){
    const ends = new Set(activeRoute.from.concat(activeRoute.to));
    svg.selectAll('.country')
      .classed('faded', d => !ends.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => ends.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => d !== activeRoute)
      .style('display', d => (d.minor && d !== activeRoute) ? 'none' : null);
    const endKey = activeRoute.pts[activeRoute.pts.length-1].join() + '|' + activeRoute.group;
    svg.selectAll('.glow').style('opacity', d => (d.c.join() + '|' + d.group) === endKey ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeCountry){
    const linked = routes.filter(r => r.from.includes(activeCountry) || r.to.includes(activeCountry));
    const keep = new Set([activeCountry]);
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => entityOf(d.properties && d.properties.name) === activeCountry);
    svg.selectAll('.route').classed('faded', d => !linked.includes(d))
      .style('display', d => (d.minor && !linked.includes(d)) ? 'none' : null);
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  // minor routes: hidden on the overview, shown when their oil type is isolated
  svg.selectAll('.route').style('display', d => (d.minor && d.group !== activeGroup) ? 'none' : null);
  svg.selectAll('.country').classed('selected', false);
  svg.selectAll('.country').classed('faded', function(d){
    if (!activeGroup) return false;
    const n = d.properties && d.properties.name;
    const info = countryInfo[n];
    return !(info && info.group === activeGroup);
  });
  svg.selectAll('.route').classed('faded', d => activeGroup ? d.group !== activeGroup : false);
  svg.selectAll('.glow').classed('faded', d => activeGroup ? d.group !== activeGroup : false)
    .style('opacity', d => (activeGroup ? (d.group === activeGroup ? 0.3 : 0) : 0.22));
  legend.selectAll('.legend-item').classed('dimmed', function(){
    if (!activeGroup) return false;
    return d3.select(this).attr('data-key') !== activeGroup;
  });
}

// ---- legend ----
const legend = d3.select('#crudeLegend');
const legendHeader = legend.append('div').attr('class','legend-header');
legendHeader.append('span').attr('class','legend-title').text('OIL TYPE:');
legendHeader.append('span').attr('class','legend-hint').text('Click a type, a country or a chokepoint to isolate it on the map. Scroll or pinch to zoom, drag to pan.');
legend.selectAll('.legend-item').data(groups).join('div')
  .attr('class','legend-item')
  .attr('data-key', d=>d.key)
  .on('click', function(event, d){
    activeCountry = null;
    activeRoute = null;
    activeChoke = null;
    activeGroup = (activeGroup === d.key) ? null : d.key;
    applyFocus();
  })
  .html(d => {
    const swatch = d.hatch
      ? '<span class="sw" style="background:repeating-linear-gradient(45deg,'+d.color+' 0 3px,'+landFill+' 3px 6px)"></span>'
      : '<span class="sw" style="background:'+d.color+'"></span>';
    const benchmarkTag = d.benchmark ? '(' + d.benchmark.toUpperCase() + ') ' : '';
    return swatch + '<span><b>' + d.name + '</b> — ' + benchmarkTag + d.desc + '</span>';
  });

// ---- line-style key (what solid vs dotted routes mean) ----
const lineKey = legend.append('div').attr('class','line-key');
lineKey.append('span').attr('class','legend-title').text('ROUTES:');
lineKey.selectAll('.line-key-row').data([
  {dash:null,  text:'<b>Solid</b> — direct tanker route'},
  {dash:'4 3', text:'<b>Dotted</b> — pipeline / overland, the long way round, or a disrupted flow'}
]).join('div')
  .attr('class','line-key-row')
  .html(d => '<svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#a3a29c" stroke-width="1.7"' +
    (d.dash ? ' stroke-dasharray="'+d.dash+'"' : '') + '/></svg><span>' + d.text + '</span>');

// ---- strategic chokepoints key ----
const chokeKey = legend.append('div').attr('class','line-key');
chokeKey.append('span').attr('class','legend-title').text('STRATEGIC CHOKEPOINTS (' + chokepoints.length + '):');
chokeKey.append('div').attr('class','line-key-row')
  .html('<svg viewBox="0 0 28 16" style="height:16px"><circle cx="14" cy="8" r="7" fill="'+chokeColor+'" fill-opacity="0.12" stroke="'+chokeColor+'" stroke-opacity="0.7"/>' +
    '<path d="M14,3L19,8L14,13L9,8Z" fill="'+chokeColor+'" stroke="#000"/></svg><span>' +
    chokepoints.map(d => d.name).join(' · ') + '</span>');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const countries = topojson.feature(world, world.objects.countries).features;
  // Everything drawn on the map lives in this layer, so zoom/pan moves it as one.
  const zoomLayer = svg.append('g').attr('class','zoom-layer');

  zoomLayer.append('g').selectAll('path').data(countries).join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill', d=>{
      const n = d.properties && d.properties.name;
      if (n==='Canada') return 'url(#canadaStripes)';
      if (n==='Kazakhstan' || n==='North Korea') return 'url(#kazakhstanStripes)';
      if (n==='Brazil' || n==='Mexico') return 'url(#latamStripes)';
      if (n==='Azerbaijan') return 'url(#azerbaijanStripes)';
      if (isImporter(n)) return importFill;
      const info = countryInfo[n];
      return (info && info.group) ? groupByKey[info.group].color : landFill;
    })
    .attr('stroke', d=>{
      const n = d.properties && d.properties.name;
      if (n==='Canada') return '#8a5f00';
      if (n==='Kazakhstan' || n==='North Korea') return '#8a1f1e';
      if (n==='Brazil' || n==='Mexico') return '#0c447c';
      if (n==='Azerbaijan') return '#993556';
      if (isImporter(n)) return importStroke;
      const info = countryInfo[n];
      return (info && info.group) ? groupByKey[info.group].stroke : landStroke;
    })
    .attr('stroke-width',1)
    .on('mouseenter', function(event, d){
      const n = d.properties && d.properties.name;
      d3.select(this).classed('hovered', true);
      if (euMemberCountries.has(n)){
        showEuTooltip(event);
        return;
      }
      const info = countryInfo[n];
      if (info){
        const g = info.group ? groupByKey[info.group] : null;
        showTooltip(event, n === 'United Kingdom' ? 'UK' : n, g ? g.color : '#888780',
          '<b>' + (g ? g.name : 'Importer (not part of a colored group)') + '</b>' +
          (info.note ? '<br>' + info.note : '') +
          formatCountryStats(info));
      } else {
        showTooltip(event, n, null, 'Not part of the tracked crude flows on this map.');
      }
    })
    .on('click', function(event, d){ event.stopPropagation(); selectCountry(entityOf(d.properties && d.properties.name)); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  zoomLayer.append('g').selectAll('circle').data(destGlow).join('circle')
    .attr('class','glow')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1])
    .attr('r',20).attr('fill',d=>groupByKey[d.group].color).attr('opacity',0.22).attr('stroke','none');

  zoomLayer.append('g').selectAll('path').data(routes).join('path')
    .attr('class','route')
    .classed('dashed', d => d.dash)
    .attr('d',d=>curvePath(d.pts,d.bend)).attr('fill','none')
    .attr('stroke',routeColor).attr('stroke-width',1.7)
    .attr('stroke-dasharray',d=>d.dash?'4 3':null).attr('opacity',0.95)
    .style('display', d => d.minor ? 'none' : null)
    .attr('marker-end','url(#arrow)')
    .on('mouseenter', function(event, d){
      d3.select(this).classed('hovered', true);
      showTooltip(event, d.label, routeColor(d), d.detail);
    })
    .on('click', (event, d) => { event.stopPropagation(); selectRoute(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  // Strategic chokepoints: halo ring + bright diamond so they stand out.
  zoomLayer.append('g').selectAll('circle').data(chokepoints).join('circle')
    .attr('class','chokepoint-halo')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1]).attr('r',11).attr('data-r',11)
    .attr('fill',chokeColor).attr('fill-opacity',0.12)
    .attr('stroke',chokeColor).attr('stroke-width',1).attr('data-sw',1).attr('stroke-opacity',0.7);
  zoomLayer.append('g').selectAll('path').data(chokepoints).join('path')
    .attr('class','chokepoint')
    .attr('d',d=>diamond(d.c,chokeSize))
    .attr('fill',chokeColor).attr('stroke','#000000').attr('stroke-width',1).attr('data-sw',1)
    .on('mouseenter', function(event, d){
      const through = routesThrough(d);
      showTooltip(event, d.name, chokeColor, '<b>Controlled by:</b> ' + d.control + '<br><br>' + d.detail + '<br><br>' + (through.length
        ? '<b>Flows through it (' + through.length + '):</b><br>' + through.map(r => r.label).join('<br>')
        : '<i>No crude flow drawn on this map passes here.</i>') + '<br><br><i>Click to isolate.</i>');
    })
    .on('click', (event, d) => { event.stopPropagation(); selectChoke(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  zoomLayer.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(euHub.c)[0]).attr('cy', pt(euHub.c)[1]).attr('r', 6).attr('data-r', 6)
    .attr('fill','none').attr('stroke','#e0ded4').attr('stroke-width',1.5).attr('data-sw',1.5)
    .on('mouseenter', showEuTooltip)
    .on('click', event => { event.stopPropagation(); selectCountry('EU'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  function label(d){
    const p = pt(d.c);
    zoomLayer.append('text').datum({x:p[0], y:p[1], dx:d.dx ?? 8, dy:d.dy})
      .attr('class','label-text').attr('x',p[0]+(d.dx ?? 8)).attr('y',p[1]+d.dy)
      .attr('font-size',11).attr('fill',d.fill ?? labelFill).attr('font-weight',d.weight ?? null).text(d.name);
  }
  originLabels.forEach(label);
  destLabels.forEach(label);
  chokepoints.forEach(d=>label({...d, dy: d.dy ?? -10, fill: chokeColor, weight: 700}));

  // ---- zoom & pan: the map magnifies, but arrows, markers and labels keep
  //      their on-screen size (line widths via the --k CSS variable). ----
  const zoom = d3.zoom().scaleExtent([1,8])
    .extent([[0,0],[960,500]]).translateExtent([[0,0],[960,500]])
    .on('zoom', ({transform}) => {
      const k = transform.k;
      zoomLayer.attr('transform', transform);
      svg.style('--k', k);
      zoomLayer.selectAll('.glow').attr('r', 20/k);
      svg.selectAll('defs pattern').attr('patternTransform', 'rotate(45) scale(' + 1/k + ')'); // hatch stripes keep their width
      zoomLayer.selectAll('path.chokepoint').attr('d', d => diamond(d.c, chokeSize/k));
      zoomLayer.selectAll('[data-r]').attr('r', function(){ return this.dataset.r/k; });
      zoomLayer.selectAll('[data-sw]').attr('stroke-width', function(){ return this.dataset.sw/k; });
      zoomLayer.selectAll('.label-text')
        .attr('x', d => d.x + d.dx/k).attr('y', d => d.y + d.dy/k).attr('font-size', 11/k);
    });
  svg.call(zoom).on('dblclick.zoom', null); // double-click stays a select/deselect, not a zoom
  const controls = d3.select('#crudeMap').append('div').attr('class','zoom-controls');
  controls.append('button').attr('title','Zoom in').text('+')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
  controls.append('button').attr('title','Zoom out').text('−')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.6));
  controls.append('button').attr('title','Reset view').text('⟲')
    .on('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));
});
})(); // end CRUDE
</script>

<script>
/* ############################################################
   REFINED — self-contained: own data, own rendering, own state.
   Shares nothing with CRUDE (separate IIFE, own SVG, own legend,
   own SVG <defs> ids prefixed "refined-"). Edit freely without
   touching the crude view.
   ############################################################ */
(function(){
/* ============================================================
   DATA — see refined.xlsx for every figure and route.
   Refined products are grouped by REFINING / EXPORT ROLE (big
   national refiners, Gulf mega-refineries, trading hubs), not by
   chemistry like crude. Coordinates are [longitude, latitude]
   approximations of the refining/port region, not exact terminals.
   ============================================================ */

const groups = [
  { key:'usa',  name:'USA', color:'#eda100', stroke:'#8a5f00', desc:'Gasoline & diesel from the Gulf Coast — the world’s biggest refined exporter.' },
  { key:'ind',  name:'India', color:'#9b6dd6', stroke:'#553584', desc:'Jamnagar, the largest refining complex on Earth — diesel and jet fuel.' },
  { key:'rus',  name:'Russia', color:'#e34948', stroke:'#8a1f1e', desc:'Diesel/gasoil, rerouted away from the EU after the 2023 product embargo.' },
  { key:'gulf', name:'Gulf refiners (Saudi Arabia, Kuwait, UAE)', color:'#3fa34d', stroke:'#245e2c', desc:'New mega-refineries: Jazan, Al-Zour, Ruwais.' },
  { key:'sgp',  name:'Singapore', color:'#2bb3a3', stroke:'#15665c', desc:'Asia-Pacific refining, blending and trading hub — imports to re-export.' },
  { key:'ara',  name:'ARA hub (Netherlands, Belgium)', color:'#4cb5e8', stroke:'#1d6790', desc:'Amsterdam-Rotterdam-Antwerp: Europe’s blending and re-export hub.' },
  { key:'kor',  name:'South Korea', color:'#eb6834', stroke:'#993c1d', desc:'Diesel, jet fuel and naphtha from SK Energy, GS Caltex, S-Oil.' },
  { key:'chn',  name:'China', color:'#2a78d6', stroke:'#0c447c', desc:'Very large exporter when Beijing opens export quotas; mostly regional.' }
];
const groupByKey = Object.fromEntries(groups.map(g=>[g.key,g]));

/* exports / imports: full refined-product breakdown per country, each
   side sums to 100% (or a single 0% "None" row). Generated from
   refined.xlsx, sheet "Export-Import % (map data)" — keep in sync by
   hand. Directions are well-established patterns; exact percentages
   are this project's estimates (see the sheet's Basis column).
   group:null = importer only, drawn in the neutral land color. */
const countryInfo = {
  'United States of America': { group:"usa", note:"Gulf Coast refineries — the world’s biggest refined-product exporter.",
    exports:[{to:"Mexico",pct:20},{to:"Other Latin America",pct:25},{to:"EU",pct:12},{to:"Canada",pct:8},{to:"Asia",pct:10},{to:"Israel",pct:1},{to:"Other",pct:24}],
    imports:[{from:"Canada",pct:45},{from:"ARA hub (Netherlands)",pct:12},{from:"South Korea",pct:8},{from:"India",pct:6},{from:"Other",pct:29}] },
  'India': { group:"ind", note:"Jamnagar (Reliance) — the largest refining complex on Earth.",
    exports:[{to:"EU",pct:25},{to:"Africa",pct:18},{to:"Singapore",pct:12},{to:"UAE",pct:10},{to:"Australia",pct:8},{to:"USA",pct:7},{to:"Other Asia",pct:20}],
    imports:[{from:"UAE",pct:30},{from:"Saudi Arabia",pct:25},{from:"Qatar",pct:15},{from:"USA",pct:10},{from:"Other",pct:20}] },
  'Russia': { group:"rus", note:"Diesel rerouted away from the EU after the Feb 2023 product embargo.",
    exports:[{to:"Turkey",pct:25},{to:"Africa",pct:22},{to:"Asia (incl. UAE transshipment)",pct:20},{to:"Brazil",pct:12},{to:"Israel",pct:1},{to:"Other / undisclosed",pct:20}],
    imports:[{from:"None",pct:0}] },
  'Saudi Arabia': { group:"gulf", note:"Jazan (Red Sea) and SATORP/YASREF mega-refineries.",
    exports:[{to:"China",pct:18},{to:"EU",pct:15},{to:"India",pct:10},{to:"Japan",pct:10},{to:"South Korea",pct:10},{to:"East Africa",pct:12},{to:"Other Asia",pct:25}],
    imports:[{from:"None",pct:0}] },
  'Kuwait': { group:"gulf", note:"Al-Zour refinery, volumes largely aimed at Europe.",
    exports:[{to:"Asia",pct:45},{to:"EU",pct:20},{to:"Africa",pct:15},{to:"Other",pct:20}],
    imports:[{from:"None",pct:0}] },
  'United Arab Emirates': { group:"gulf", note:"Ruwais refinery; Fujairah is a major blending/bunkering hub.",
    exports:[{to:"Asia",pct:40},{to:"East Africa",pct:18},{to:"EU",pct:15},{to:"Other",pct:27}],
    imports:[{from:"Russia",pct:35},{from:"India",pct:15},{from:"Other",pct:50}] },
  'Singapore': { group:"sgp", note:"Asia-Pacific refining, blending and trading hub.",
    exports:[{to:"Indonesia",pct:22},{to:"Australia",pct:15},{to:"Malaysia",pct:12},{to:"Vietnam",pct:10},{to:"Philippines",pct:8},{to:"China",pct:8},{to:"Other Asia",pct:25}],
    imports:[{from:"Gulf refiners",pct:30},{from:"India",pct:15},{from:"China",pct:12},{from:"Russia",pct:10},{from:"Other",pct:33}] },
  'Netherlands': { group:"ara", note:"Rotterdam — core of the ARA blending and re-export hub.",
    exports:[{to:"EU",pct:45},{to:"UK",pct:15},{to:"West Africa",pct:15},{to:"USA",pct:10},{to:"Other",pct:15}],

function diamond(c, s){ const p=pt(c); return `M${p[0]},${p[1]-s}L${p[0]+s},${p[1]}L${p[0]},${p[1]+s}L${p[0]-s},${p[1]}Z`; }
function curvePath(points, bend){
  const p = points.map(pt);
  let d = 'M'+p[0][0]+','+p[0][1];
  for (let i=1;i<p.length;i++){
    const mx=(p[i-1][0]+p[i][0])/2, my=(p[i-1][1]+p[i][1])/2 - bend;
    d += ' Q'+mx+','+my+' '+p[i][0]+','+p[i][1];
  }
  return d;
}

// ---- tooltip ----
const tooltip = d3.select('#tooltip');
function showTooltip(event, titleHtml, dotColor, bodyHtml){
  tooltip.html(
    '<div class="tt-title">' + (dotColor ? '<span class="tt-dot" style="background:'+dotColor+'"></span>' : '') + titleHtml + '</div>' +
    '<div class="tt-body">' + bodyHtml + '</div>'
  );
  moveTooltip(event);
  tooltip.classed('show', true);
}
function moveTooltip(event){
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ttNode = tooltip.node();
  const w = ttNode.offsetWidth || 240, h = ttNode.offsetHeight || 60;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + w + pad > vw) x = event.clientX - w - pad;
  if (y + h + pad > vh) y = event.clientY - h - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}
function hideTooltip(){ tooltip.classed('show', false); }

function formatStatLine(pct, place){
  return '<b>' + pct + '%</b> ' + place;
}
function formatCountryStats(info){
  const exportsPct = info.exports.reduce((s,e)=>s+e.pct, 0);
  const importsPct = info.imports.reduce((s,e)=>s+e.pct, 0);
  return (
    '<div style="margin-top:4px"><b>Export</b> (' + Math.round(exportsPct) + '%)<br>' +
      info.exports.map(e => formatStatLine(e.pct, e.to)).join('<br>') + '</div>' +
    '<div style="margin-top:4px"><b>Import</b> (' + Math.round(importsPct) + '%)<br>' +
      info.imports.map(e => formatStatLine(e.pct, e.from)).join('<br>') + '</div>'
  );
}
function showCountryTooltip(event, name, info){
  const g = info.group ? groupByKey[info.group] : null;
  showTooltip(event, name, g ? g.color : '#888780',
    '<b>' + (g ? g.name : 'Importer (not part of a colored group)') + '</b>' +
    (info.note ? '<br>' + info.note : '') +
    formatCountryStats(info));
}
function showEuTooltip(event){
  showTooltip(event, euHub.name, '#e0ded4', euHub.note + formatCountryStats(euHub));
}

// ---- legend state (click to isolate a group) ----
let activeGroup = null;   // null = show all
let activeRoute = null;   // a single clicked arrow; null = none
let activeCountry = null; // a countryInfo name, 'EU' or 'Singapore'; null = none
let activeChoke = null;   // a clicked chokepoint; null = none

// Routes passing through a chokepoint: a waypoint sits on it, or the route
// lists it in via[] (for arrows that pass it without a waypoint there).
function routesThrough(cp){
  return routes.filter(r => (r.via || []).includes(cp.name) ||
    r.pts.some(p => Math.abs(p[0]-cp.c[0]) < 0.5 && Math.abs(p[1]-cp.c[1]) < 0.5));
}
// Click a chokepoint: isolate every arrow through it and the countries at
// both ends. Click it again (or the sea) to reset.
function selectChoke(cp){
  activeChoke = (activeChoke === cp) ? null : cp;
  activeCountry = null;
  activeGroup = null;
  activeRoute = null;
  applyFocus();
}

// Which clickable "entity" a topology country belongs to (EU members → 'EU').
function entityOf(n){ return euMemberCountries.has(n) ? 'EU' : (countryInfo[n] ? n : null); }
// Click a country: isolate it and every arrow into / out of it. Click it
// again (or the sea, or an untracked country) to reset.
function selectCountry(e){
  activeCountry = (e && activeCountry !== e) ? e : null;
  activeGroup = null;
  activeRoute = null;
  activeChoke = null;
  applyFocus();
}

// Click an arrow: isolate it and the countries at its two ends. Click it
// again (or the sea) to reset.
function selectRoute(r){
  activeRoute = (activeRoute === r) ? null : r;
  activeCountry = null;
  activeGroup = null;
  activeChoke = null;
  applyFocus();
}

function applyFocus(){
  svg.selectAll('.chokepoint-halo, path.chokepoint')
    .classed('faded', d => activeChoke ? d !== activeChoke : false)
    .classed('selected', d => d === activeChoke);
  if (activeChoke){
    const linked = routesThrough(activeChoke);
    const keep = new Set();
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => keep.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => !linked.includes(d));
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeRoute){
    const ends = new Set(activeRoute.from.concat(activeRoute.to));
    svg.selectAll('.country')
      .classed('faded', d => !ends.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => ends.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => d !== activeRoute)
      .style('display', d => (d.minor && d !== activeRoute) ? 'none' : null);
    const endKey = activeRoute.pts[activeRoute.pts.length-1].join() + '|' + activeRoute.group;
    svg.selectAll('.glow').style('opacity', d => (d.c.join() + '|' + d.group) === endKey ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeCountry){
    const linked = routes.filter(r => r.from.includes(activeCountry) || r.to.includes(activeCountry));
    const keep = new Set([activeCountry]);
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => entityOf(d.properties && d.properties.name) === activeCountry);
    svg.selectAll('.route').classed('faded', d => !linked.includes(d));
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  svg.selectAll('.country').classed('selected', false);
  svg.selectAll('.country').classed('faded', function(d){
    if (!activeGroup) return false;
    const info = countryInfo[d.properties && d.properties.name];
    return !(info && info.group === activeGroup);
  });
  svg.selectAll('.route').classed('faded', d => activeGroup ? d.group !== activeGroup : false);
  svg.selectAll('.glow').style('opacity', d => (activeGroup ? (d.group === activeGroup ? 0.3 : 0) : 0.22));
  legend.selectAll('.legend-item').classed('dimmed', function(){
    if (!activeGroup) return false;
    return d3.select(this).attr('data-key') !== activeGroup;
  });
}

// ---- legend ----
const legend = d3.select('#refinedLegend');
const legendHeader = legend.append('div').attr('class','legend-header');
legendHeader.append('span').attr('class','legend-title').text('EXPORTER / HUB:');
legendHeader.append('span').attr('class','legend-hint').text('Click a type, a country or a chokepoint to isolate it on the map. Scroll or pinch to zoom, drag to pan.');
legend.selectAll('.legend-item').data(groups).join('div')
  .attr('class','legend-item')
  .attr('data-key', d=>d.key)
  .on('click', function(event, d){
    activeCountry = null;
    activeRoute = null;
    activeChoke = null;
    activeGroup = (activeGroup === d.key) ? null : d.key;
    applyFocus();
  })
  .html(d => '<span class="sw" style="background:'+d.color+'"></span><span><b>' + d.name + '</b> — ' + d.desc + '</span>');

// ---- line-style key (what solid vs dotted routes mean) ----
const lineKey = legend.append('div').attr('class','line-key');
lineKey.append('span').attr('class','legend-title').text('ROUTES:');
lineKey.selectAll('.line-key-row').data([
  {dash:null,  text:'<b>Solid</b> — direct tanker route'},
  {dash:'4 3', text:'<b>Dotted</b> — indirect flow (re-export, blending / transshipment) or inland barge / pipeline'}
]).join('div')
  .attr('class','line-key-row')
  .html(d => '<svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#a3a29c" stroke-width="1.7"' +
    (d.dash ? ' stroke-dasharray="'+d.dash+'"' : '') + '/></svg><span>' + d.text + '</span>');

// ---- strategic chokepoints key ----
const chokeKey = legend.append('div').attr('class','line-key');
chokeKey.append('span').attr('class','legend-title').text('STRATEGIC CHOKEPOINTS (' + chokepoints.length + '):');
chokeKey.append('div').attr('class','line-key-row')
  .html('<svg viewBox="0 0 28 16" style="height:16px"><circle cx="14" cy="8" r="7" fill="'+chokeColor+'" fill-opacity="0.12" stroke="'+chokeColor+'" stroke-opacity="0.7"/>' +
    '<path d="M14,3L19,8L14,13L9,8Z" fill="'+chokeColor+'" stroke="#000"/></svg><span>' +
    chokepoints.map(d => d.name).join(' · ') + '</span>');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const countries = topojson.feature(world, world.objects.countries).features;
  // Everything drawn on the map lives in this layer, so zoom/pan moves it as one.
  const zoomLayer = svg.append('g').attr('class','zoom-layer');

  zoomLayer.append('g').selectAll('path').data(countries).join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill', d=>{
      if (isImporter(d.properties && d.properties.name)) return importFill;
      const info = countryInfo[d.properties && d.properties.name];
      return (info && info.group) ? groupByKey[info.group].color : landFill;
    })
    .attr('stroke', d=>{
      if (isImporter(d.properties && d.properties.name)) return importStroke;
      const info = countryInfo[d.properties && d.properties.name];
      return (info && info.group) ? groupByKey[info.group].stroke : landStroke;
    })
    .attr('stroke-width',1)
    .on('mouseenter', function(event, d){
      const n = d.properties && d.properties.name;
      d3.select(this).classed('hovered', true);
      if (euMemberCountries.has(n)){ showEuTooltip(event); return; }
      const info = countryInfo[n];
      if (info) showCountryTooltip(event, n === 'United Kingdom' ? 'UK' : n, info);
      else showTooltip(event, n, null, 'Not part of the tracked refined-product flows on this map.');
    })
    .on('click', function(event, d){ event.stopPropagation(); selectCountry(entityOf(d.properties && d.properties.name)); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  zoomLayer.append('g').selectAll('circle').data(destGlow).join('circle')
    .attr('class','glow')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1])
    .attr('r',16).attr('fill',d=>groupByKey[d.group].color).attr('opacity',0.22).attr('stroke','none');

  zoomLayer.append('g').selectAll('path').data(routes).join('path')
    .attr('class','route')
    .classed('dashed', d => d.dash)
    .attr('d',d=>curvePath(d.pts,d.bend)).attr('fill','none')
    .attr('stroke',d=>groupByKey[d.group].color).attr('stroke-width',1.7)
    .attr('stroke-dasharray',d=>d.dash?'4 3':null).attr('opacity',0.95)
    .attr('marker-end','url(#refined-arrow)')
    .on('mouseenter', function(event, d){
      d3.select(this).classed('hovered', true);
      showTooltip(event, d.label, groupByKey[d.group].color, d.detail);
    })
    .on('click', (event, d) => { event.stopPropagation(); selectRoute(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  // Strategic chokepoints: halo ring + bright diamond so they stand out.
  zoomLayer.append('g').selectAll('circle').data(chokepoints).join('circle')
    .attr('class','chokepoint-halo')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1]).attr('r',11).attr('data-r',11)
    .attr('fill',chokeColor).attr('fill-opacity',0.12)
    .attr('stroke',chokeColor).attr('stroke-width',1).attr('data-sw',1).attr('stroke-opacity',0.7);
  zoomLayer.append('g').selectAll('path').data(chokepoints).join('path')
    .attr('class','chokepoint')
    .attr('d',d=>diamond(d.c,chokeSize))
    .attr('fill',chokeColor).attr('stroke','#000000').attr('stroke-width',1).attr('data-sw',1)
    .on('mouseenter', function(event, d){
      const through = routesThrough(d);
      showTooltip(event, d.name, chokeColor, '<b>Controlled by:</b> ' + d.control + '<br><br>' + d.detail + '<br><br>' + (through.length
        ? '<b>Flows through it (' + through.length + '):</b><br>' + through.map(r => r.label).join('<br>')
        : '<i>No refined flow drawn on this map passes here.</i>') + '<br><br><i>Click to isolate.</i>');
    })
    .on('click', (event, d) => { event.stopPropagation(); selectChoke(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  // EU hub marker
  zoomLayer.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(euHub.c)[0]).attr('cy', pt(euHub.c)[1]).attr('r', 6).attr('data-r', 6)
    .attr('fill','none').attr('stroke','#e0ded4').attr('stroke-width',1.5).attr('data-sw',1.5)
    .on('mouseenter', showEuTooltip)
    .on('click', event => { event.stopPropagation(); selectCountry('EU'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  // Singapore hub marker (not a polygon at 110m resolution)
  zoomLayer.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(singaporeHub.c)[0]).attr('cy', pt(singaporeHub.c)[1]).attr('r', 5).attr('data-r', 5)
    .attr('fill', groupByKey.sgp.color).attr('stroke','#e0ded4').attr('stroke-width',1.2).attr('data-sw',1.2)
    .on('mouseenter', event => showCountryTooltip(event, singaporeHub.name, countryInfo['Singapore']))
    .on('click', event => { event.stopPropagation(); selectCountry('Singapore'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  function label(d){
    const p = pt(d.c);
    zoomLayer.append('text').datum({x:p[0], y:p[1], dx:d.dx ?? 8, dy:d.dy})
      .attr('class','label-text').attr('x',p[0]+(d.dx ?? 8)).attr('y',p[1]+d.dy)
      .attr('font-size',11).attr('fill',d.fill ?? labelFill).attr('font-weight',d.weight ?? null).text(d.name);
  }
  originLabels.forEach(label);
  destLabels.forEach(label);
  chokepoints.forEach(d=>label({...d, dy: d.dy ?? -10, fill: chokeColor, weight: 700}));

  // ---- zoom & pan: the map magnifies, but arrows, markers and labels keep
  //      their on-screen size (line widths via the --k CSS variable). ----
  const zoom = d3.zoom().scaleExtent([1,8])
    .extent([[0,0],[960,500]]).translateExtent([[0,0],[960,500]])
    .on('zoom', ({transform}) => {
      const k = transform.k;
      zoomLayer.attr('transform', transform);
      svg.style('--k', k);
      zoomLayer.selectAll('.glow').attr('r', 16/k);
      zoomLayer.selectAll('path.chokepoint').attr('d', d => diamond(d.c, chokeSize/k));
      zoomLayer.selectAll('[data-r]').attr('r', function(){ return this.dataset.r/k; });
      zoomLayer.selectAll('[data-sw]').attr('stroke-width', function(){ return this.dataset.sw/k; });
      zoomLayer.selectAll('.label-text')
        .attr('x', d => d.x + d.dx/k).attr('y', d => d.y + d.dy/k).attr('font-size', 11/k);
    });
  svg.call(zoom).on('dblclick.zoom', null); // double-click stays a select/deselect, not a zoom
  const controls = d3.select('#refinedMap').append('div').attr('class','zoom-controls');
  controls.append('button').attr('title','Zoom in').text('+')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
  controls.append('button').attr('title','Zoom out').text('−')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.6));
  controls.append('button').attr('title','Reset view').text('⟲')
    .on('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));
});
})(); // end REFINED
</script>
<script>
/* ############################################################
   FIELDS — self-contained: own data, own rendering, own state.
   Shares nothing with CRUDE or REFINED (separate IIFE, own SVG, own
   legend). Tracks WHO owns / controls the world's giant oil fields: one
   color per company; the Seven Sisters' successors (ExxonMobil, Chevron,
   BP, Shell) keep their classic colors.
   ############################################################ */
(function(){
/* ============================================================
   DATA — see fields.xlsx for every field, stake and note.
   kbd = crude + condensate output, thousand barrels/day (~2025 est.).
   owner = the company the field "belongs to" on the map (its color):
     a Seven Sisters successor if one is involved at all — operator,
     subsidiary or stake (user rule; operator first, else biggest stake),
     otherwise the operator / controlling company.
   partners = [company, equity %]; % null = not published / uncertain.
   ============================================================ */

// Every owner company: name, home-country flag + nationality, who owns it,
// map color (unique per company), and Seven Sisters lineage where relevant.
const companies = {
  exxon:          {name:'ExxonMobil', flag:'🇺🇸', nat:'American', own:'Private — publicly traded (NYSE).', color:'#e34948',
                   sister:'Standard Oil of New Jersey (Esso → Exxon) + Standard Oil Co. of New York (Socony → Mobil), merged 1999'},
  chevron:        {name:'Chevron', flag:'🇺🇸', nat:'American', own:'Private — publicly traded (NYSE).', color:'#2a78d6',
                   sister:'Standard Oil of California (Socal) + Gulf Oil (bought 1984) + Texaco (merged 2001)'},
  bp:             {name:'BP', flag:'🇬🇧', nat:'British', own:'Private — publicly traded (London).', color:'#3fa34d',
                   sister:'Anglo-Persian Oil Company (later Anglo-Iranian)'},
  shell:          {name:'Shell', flag:'🇬🇧', nat:'British (Anglo-Dutch until 2022)', own:'Private — publicly traded (London).', color:'#eda100',
                   sister:'Royal Dutch Shell — the only Sister never merged away'},
  aramco:         {name:'Saudi Aramco', flag:'🇸🇦', nat:'Saudi', own:'State-owned — the Saudi government and its PIF fund hold ~98%; ~2% listed (2019).', aka:["Saudi Aramco"], color:'#1fb5a8'},
  koc:            {name:'Kuwait Oil Company', flag:'🇰🇼', nat:'Kuwaiti', own:'State-owned — subsidiary of Kuwait Petroleum Corporation (100% state).', label:'KOC (Kuwait)', aka:["Kuwait Oil Company", "KGOC", "Kuwait Gulf Oil"], color:'#f48fb1'},
  nioc:           {name:'NIOC', flag:'🇮🇷', nat:'Iranian', own:'State-owned — 100% Iranian state (National Iranian Oil Company).', aka:["NIOC"], color:'#a66bd6'},
  adnoc:          {name:'ADNOC', flag:'🇦🇪', nat:'Emirati', own:'State-owned — 100% Abu Dhabi government.', aka:["ADNOC"], color:'#7cc8f2'},
  qatarenergy:    {name:'QatarEnergy', flag:'🇶🇦', nat:'Qatari', own:'State-owned — 100% Qatari state.', aka:["QatarEnergy"], color:'#d6457a'},
  basra:          {name:'Basra Oil Company', flag:'🇮🇶', nat:'Iraqi', own:'State-owned — Iraqi Ministry of Oil.', label:'Basra Oil Co.', aka:["Basra Oil"], color:'#b5d95a'},
  petrochina:     {name:'PetroChina', flag:'🇨🇳', nat:'Chinese', own:'State-controlled — majority owned by CNPC (Chinese state); listed in Hong Kong and Shanghai.', aka:["PetroChina", "CNPC", "CNODC"], color:'#ff7a3d'},
  sinopec:        {name:'Sinopec', flag:'🇨🇳', nat:'Chinese', own:'State-controlled — majority owned by Sinopec Group (Chinese state).', aka:["Sinopec"], color:'#ffe27a'},
  cnooc:          {name:'CNOOC', flag:'🇨🇳', nat:'Chinese', own:'State-controlled — majority owned by the CNOOC group (Chinese state).', aka:["CNOOC"], color:'#43c6db'},
  lukoil:         {name:'Lukoil', flag:'🇷🇺', nat:'Russian', own:'Private — Russia’s largest non-state oil company.', aka:["Lukoil", "LukArco"], color:'#b08968'},
  eni:            {name:'Eni', flag:'🇮🇹', nat:'Italian', own:'Partly state-owned — the Italian state holds ~30% (Treasury + CDP).', aka:["Eni", "Vår Energi"], color:'#e040fb',
                   rival:'Never a Sister — the challenger: its founder Enrico Mattei coined the name “Seven Sisters” in the 1950s'},
  rosneft:        {name:'Rosneft', flag:'🇷🇺', nat:'Russian', own:'State-controlled — the Russian state (via Rosneftegaz) is the largest shareholder.', aka:["Rosneft"], color:'#ff9e9e'},
  tatneft:        {name:'Tatneft', flag:'🇷🇺', nat:'Russian', own:'Controlled by the Tatarstan regional government (~36% + golden share).', aka:["Tatneft"], color:'#c3a6ff'},
  equinor:        {name:'Equinor', flag:'🇳🇴', nat:'Norwegian', own:'Majority state-owned — the Norwegian state holds 67%.', aka:["Equinor"], color:'#ff5c8a'},
  conocophillips: {name:'ConocoPhillips', flag:'🇺🇸', nat:'American', own:'Private — publicly traded (NYSE).', aka:["ConocoPhillips"], color:'#9aa5b1'},
  totalenergies:  {name:'TotalEnergies', flag:'🇫🇷', nat:'French', own:'Private — publicly traded (Paris).', aka:["TotalEnergies"], color:'#8c6cff'},
  renaissance:    {name:'Renaissance Africa Energy', flag:'🇳🇬', nat:'Nigerian', own:'Private — consortium of Nigerian independent oil companies.', label:'Renaissance', aka:["Renaissance"], color:'#00c2ff'},
  noclibya:       {name:'National Oil Corporation (Libya)', flag:'🇱🇾', nat:'Libyan', own:'State-owned — 100% Libyan state.', label:'NOC Libya', aka:["NOC Libya", "NOC", "Waha Oil", "AGOCO", "Akakus"], color:'#c7ea46'},
  sonatrach:      {name:'Sonatrach', flag:'🇩🇿', nat:'Algerian', own:'State-owned — 100% Algerian state.', aka:["Sonatrach"], color:'#7ee8c8'},
  eog:            {name:'EOG Resources', flag:'🇺🇸', nat:'American', own:'Private — publicly traded (NYSE).', label:'EOG', aka:["EOG"], color:'#d4a373'},
  pemex:          {name:'Pemex', flag:'🇲🇽', nat:'Mexican', own:'State-owned — 100% Mexican state.', aka:["Pemex"], color:'#06d6a0'},
  petrobras:      {name:'Petrobras', flag:'🇧🇷', nat:'Brazilian', own:'State-controlled — the Brazilian government holds ~50% of voting shares.', aka:["Petrobras"], color:'#9ef01a'},
  ongc:           {name:'ONGC', flag:'🇮🇳', nat:'Indian', own:'State-controlled — the Indian government holds ~59%.', aka:["ONGC"], color:'#ffadad'},
  pertamina:      {name:'Pertamina', flag:'🇮🇩', nat:'Indonesian', own:'State-owned — 100% Indonesian state.', aka:["Pertamina"], color:'#e76f51'}

// Derived per field: every Sister involved (listed in the tooltip).
fields.forEach(f => {
  const stakes = [];
  f.partners.forEach(p => { const k = sisterOf(p[0]); if (k && !stakes.includes(k)) stakes.push(k); });
  if (f.opSis && !stakes.includes(f.opSis)) stakes.unshift(f.opSis);
  f.sisters = stakes;
});

   ============================================================ */
const landFill = '#262623', landStroke = '#4a4944';
const fieldLandFill = '#33322e';   // countries with at least one tracked field
const labelFill = '#f0efec';
const countriesWithFields = new Set();
// Topology names differ from the display names used in the data.
const topoName = { 'USA':'United States of America', 'UK':'United Kingdom', 'UAE':'United Arab Emirates' };
fields.forEach(f => f.country.split(' / ').forEach(n => countriesWithFields.add(topoName[n] || n)));
function displayName(n){ return ({'United States of America':'USA','United Kingdom':'UK','United Arab Emirates':'UAE'})[n] || n; }

const projection = d3.geoNaturalEarth1().scale(200).translate([420,270]);
const path = d3.geoPath(projection);
const svg = d3.select('#fieldsMap').append('svg')
  .attr('viewBox','0 0 960 500')
  .on('click', () => { activeKey = null; activeField = null; activeCountry = null; applyFocus(); }); // click the sea = reset

function pt(c){ return projection(c); }
function radius(f){ return 2.2 + Math.sqrt(f.kbd) * 0.13; }
function fieldFill(f){ return companies[f.owner].color; }
const dotColor = fieldFill;
const sisterKeys = ['exxon','chevron','bp','shell'];

// Is company k involved in field f at all (owner, operator or partner)?
// Sisters match by the first word of a name (so 'Aker BP' is not BP);
// the others by any of their aka names appearing in the operator or partners.
function involved(f, k){
  if (f.owner === k) return true;
  if (sisterKeys.includes(k)) return f.sisters.includes(k);
  const names = [f.op].concat(f.partners.map(p => p[0]));
  return (companies[k].aka || []).some(a => names.some(n => new RegExp('(^|[^\\p{L}])' + a + '($|[^\\p{L}])', 'u').test(n)));
}
// Oil each company controls = total output of the fields it owns (its color).
Object.entries(companies).forEach(([k, c]) => {
  c.key = k;
  const own = fields.filter(f => f.owner === k);
  c.kbd = own.reduce((t, f) => t + f.kbd, 0);
  c.nOwn = own.length;
  c.nInv = fields.filter(f => involved(f, k)).length;
});

// ---- tooltip helpers (own copies) ----
const tooltip = d3.select('#tooltip');
function showTooltip(event, titleHtml, dotColor, bodyHtml){
  tooltip.html(
    '<div class="tt-title">' + (dotColor ? '<span class="tt-dot" style="background:'+dotColor+'"></span>' : '') + titleHtml + '</div>' +
    '<div class="tt-body">' + bodyHtml + '</div>'
  );
  moveTooltip(event);
  tooltip.classed('show', true);
}
function moveTooltip(event){
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ttNode = tooltip.node();
  const w = ttNode.offsetWidth || 240, h = ttNode.offsetHeight || 60;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + w + pad > vw) x = event.clientX - w - pad;
  if (y + h + pad > vh) y = event.clientY - h - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}
function hideTooltip(){ tooltip.classed('show', false); }

function companyLine(p){
  const k = sisterOf(p[0]);
  const name = k ? '<b style="color:' + companies[k].color + '">' + p[0] + '</b>' : p[0];
  return name + (p[1] == null ? '' : ' — ' + p[1] + '%');
}
// Hover: WHO it belongs to (company, nationality, state or private) first,
// then the concession details.
function fieldTooltip(event, f){
  const o = companies[f.owner];
  const allKnown = f.partners.every(p => p[1] != null);
  const operates = f.opSis === f.owner || [o.name.split(' ')[0]].concat(o.aka || []).some(a => f.op.includes(a));
  showTooltip(event, f.name + ' (' + f.country + ')', o.color,
    '<b>Belongs to:</b> <b style="color:' + o.color + '">' + o.name + '</b> ' + o.flag + ' — ' + o.nat + ' company<br>' +
    o.own +
    (o.sister ? '<br>One of the Seven Sisters: ' + o.sister + '.' : '') +
    (o.rival ? '<br>' + o.rival + '.' : '') +
    (operates ? '' : f.op.startsWith('Many operators')
      ? '<br><i>' + o.name + ' is one of the main producers in this basin.</i>'
      : '<br><i>' + o.name + ' is a partner (stake or contract); the field is operated by ' + f.op + '.</i>') +
    '<div style="margin-top:6px"><b>Operator:</b> ' + f.op + '</div>' +
    '<div style="margin-top:4px"><b>' + (allKnown ? 'Concession holders (equity):' : 'Companies involved:') + '</b><br>' +
      f.partners.map(companyLine).join('<br>') + '</div>' +
    '<div style="margin-top:4px"><b>Concession / contract:</b> ' + f.contract + '</div>' +
    '<div style="margin-top:4px">Discovered ' + f.disc + ' · ~' + f.kbd.toLocaleString('en-US') + ' kb/d</div>' +
    (f.note ? '<div style="margin-top:4px">' + f.note + '</div>' : '') +
    (f.hist ? '<div style="margin-top:4px"><i>' + f.hist + '</i></div>' : ''));
}

// Re-places field labels (replaced once the map has loaded; a no-op until then).
let layoutLabels = function(){};

// ---- focus state ----
let activeKey = null;     // a company key: only the fields it owns (its color) stay
let activeField = null;   // the clicked field (white outline)
let activeCountry = null; // a clicked country (topology name)

function keepField(f){
  if (activeCountry) return f.country.split(' / ').some(n => (topoName[n] || n) === activeCountry);
  return activeKey ? f.owner === activeKey : true;
}
function applyFocus(){
  svg.selectAll('.field')
    .classed('faded', f => !keepField(f))
    .classed('selected', f => f === activeField || (activeKey && f.owner === activeKey));
  svg.selectAll('.country').classed('selected', d => d.properties && d.properties.name === activeCountry);
  // The legend follows the map: other companies dim, and the active one
  // scrolls into view (also when it was picked by clicking a field).
  legend.selectAll('.legend-item').classed('dimmed', function(){
    return activeKey ? d3.select(this).attr('data-key') !== activeKey : false;
  });
  if (activeKey){
    const row = legend.select('.legend-item[data-key="' + activeKey + '"]').node();
    const list = row && row.parentNode;
    if (list){
      const r = row.getBoundingClientRect(), l = list.getBoundingClientRect();
      if (r.top < l.top || r.bottom > l.bottom) list.scrollTop += r.top - l.top - 8;
    }
  }
  layoutLabels();
}
// Click a field: highlight and isolate every field of the same company
// worldwide. Click it again (or the sea) to reset.
function selectField(f){
  if (activeField === f){ activeField = null; activeKey = null; activeCountry = null; applyFocus(); return; }
  activeField = f; activeKey = f.owner; activeCountry = null;
  applyFocus();
}

  .on('click', function(event, c){

  .html(c => '<span class="sw" style="background:' + c.color + '"></span>' +

    '<br>~' + c.kbd.toLocaleString('en-US') + ' kb/d in ' + c.nOwn + ' field' + (c.nOwn === 1 ? '' : 's') +
    (c.nInv > c.nOwn ? ' · stakes in ' + (c.nInv - c.nOwn) + ' more' : '') + '</span>');
const sizeKey = legend.append('div').attr('class','line-key');
sizeKey.append('span').attr('class','legend-title').text('FIELD SIZE (crude + condensate output):');
sizeKey.append('div').attr('class','line-key-row')
  .html('<svg viewBox="0 0 120 30" style="width:120px;height:30px;flex:0 0 120px">' +
    [[100,12],[1000,44],[3000,88]].map(([k,x]) => {
      const r = 2.2 + Math.sqrt(k)*0.13;
      return '<circle cx="' + x + '" cy="' + (26-r) + '" r="' + r + '" fill="none" stroke="#a3a29c"/>';
    }).join('') + '</svg><span>100 · 1,000 · 3,000 thousand barrels/day</span>');
sizeKey.append('div').attr('class','legend-hint').style('font-size','10.5px').style('margin-top','4px')
  .text(fields.length + ' oil fields, ' + Object.keys(companies).length + ' companies. Stakes are best estimates (~2025) — see fields.xlsx.');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const countries = topojson.feature(world, world.objects.countries).features;
  // Everything drawn on the map lives in this layer, so zoom/pan moves it as one.
  const zoomLayer = svg.append('g').attr('class','zoom-layer');

  zoomLayer.append('g').selectAll('path').data(countries).join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill', d => countriesWithFields.has(d.properties && d.properties.name) ? fieldLandFill : landFill)
    .attr('stroke', landStroke)
    .attr('stroke-width',1)
    .on('mouseenter', function(event, d){
      const n = d.properties && d.properties.name;
      d3.select(this).classed('hovered', true);
      const own = fields.filter(f => f.country.split(' / ').some(c => (topoName[c] || c) === n));
      showTooltip(event, displayName(n), null, own.length
        ? own.map(f => '<span style="color:' + dotColor(f) + '">●</span> ' + f.name + ' — ' + companies[f.owner].name).join('<br>')
        : 'No giant field tracked here.');
    })
    .on('click', function(event, d){
      event.stopPropagation();
      const n = d.properties && d.properties.name;
      activeField = null; activeKey = null;
      activeCountry = (countriesWithFields.has(n) && activeCountry !== n) ? n : null;
      applyFocus();
    })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  // Big fields first so small ones sit on top and stay clickable.
  const sorted = fields.slice().sort((a,b) => b.kbd - a.kbd);
  zoomLayer.append('g').selectAll('circle').data(sorted).join('circle')
    .attr('class','field')
    .attr('cx', f => pt(f.c)[0]).attr('cy', f => pt(f.c)[1])
    .attr('r', radius)
    .attr('fill', fieldFill)
    .attr('stroke','#000000').attr('stroke-width',0.8)
    .on('mouseenter', function(event, f){ d3.select(this).classed('hovered', true); fieldTooltip(event, f); })
    .on('click', (event, f) => { event.stopPropagation(); selectField(f); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  // Labels = the COMPANY the field belongs to (user rule; the field name is
  // in the hover tooltip). Biggest fields win; a label is hidden if it
  // would overlap one already placed (re-run on every zoom, so more appear
  // as you zoom in).
  const labels = zoomLayer.append('g').selectAll('text').data(sorted).join('text')
    .attr('class','label-text field-label')
    .attr('fill', labelFill)
    .text(f => companies[f.owner].label || companies[f.owner].name);
  let k = 1;
  layoutLabels = function(){
    const placed = [];
    labels.each(function(f){
      const p = pt(f.c);
      const el = d3.select(this)
        .attr('x', p[0] + (radius(f) + 3)/k).attr('y', p[1] + 3.5/k).attr('font-size', 10.5/k)
        .style('display', null);
      if (!keepField(f)){ el.style('display','none'); return; }
      const b = this.getBBox();
      const hit = placed.some(q => b.x < q.x + q.width && b.x + b.width > q.x && b.y < q.y + q.height && b.y + b.height > q.y);
      if (hit) el.style('display','none'); else placed.push(b);
    });
  };
  layoutLabels();
  // Labels can only be measured while the view is visible: re-place them
  // whenever the FIELDS view is shown (the shared toggle flips "hidden").
  new MutationObserver(() => { if (!document.getElementById('fieldsView').hidden) layoutLabels(); })
    .observe(document.getElementById('fieldsView'), {attributes:true, attributeFilter:['hidden']});

  // ---- zoom & pan: the map magnifies, but markers and labels keep their
  //      on-screen size (country strokes via the --k CSS variable). ----
  const zoom = d3.zoom().scaleExtent([1,12])
    .extent([[0,0],[960,500]]).translateExtent([[0,0],[960,500]])
    .on('zoom', ({transform}) => {
      k = transform.k;
      zoomLayer.attr('transform', transform);
      svg.style('--k', k);
      zoomLayer.selectAll('circle.field').attr('r', f => radius(f)/k).attr('stroke-width', 0.8/k);
      layoutLabels();
    });
  svg.call(zoom).on('dblclick.zoom', null); // double-click stays a select/deselect, not a zoom
  const controls = d3.select('#fieldsMap').append('div').attr('class','zoom-controls');
  controls.append('button').attr('title','Zoom in').text('+')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
  controls.append('button').attr('title','Zoom out').text('−')
    .on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.6));
  controls.append('button').attr('title','Reset view').text('⟲')
    .on('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));
});
})();
</script>

</body>
</html>
