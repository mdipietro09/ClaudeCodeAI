<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OIL</title>
<style>
  :root{
    --bg:#000000; --fg:#f0efec; --sub:#a3a29c; --panel:#161615; --panel-border:#3a3a37;
    --land:#262623; --land-stroke:#4a4944; --chip-bg:#161615;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:24px; }
  h1 { font-size:22px; font-weight:700; letter-spacing:0.06em; margin:0 0 14px; }

  .type-toggle { display:inline-flex; gap:4px; padding:4px; border-radius:9px; background:var(--panel); border:1px solid var(--panel-border); margin-bottom:20px; }
  .type-btn {
    font:inherit; font-size:12px; font-weight:600; letter-spacing:0.04em; color:var(--sub);
    background:none; border:none; padding:7px 16px; border-radius:6px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .type-btn:hover { color:var(--fg); }
  .type-btn.active { background:var(--fg); color:#000; }

  .wrap { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .map-col { flex:1 1 auto; min-width:0; }
  .map { width:100%; position:relative; }
  svg { width:100%; height:auto; display:block; }

  .legend { display:flex; flex-direction:column; gap:2px; margin-top:14px; font-size:12.5px; color:var(--sub); flex:0 0 260px; }
  .legend-item {
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    cursor:pointer; user-select:none; transition:background .15s ease;
  }
  .legend-item:hover { background: rgba(127,127,127,0.12); }
  .legend-item.dimmed { opacity:0.35; }
  .legend-header { padding:0 8px; margin:0 0 8px; }
  .legend-title { display:block; font-size:13px; font-weight:700; color:var(--fg); letter-spacing:0.03em; margin:0 0 2px; }
  .legend .sw { width:12px; height:12px; flex:0 0 12px; display:inline-block; border-radius:3px; }
  .legend b { color:var(--fg); font-weight:600; }
  .legend-hint { display:block; font-size:8.5px; line-height:1.2; color:var(--sub); }
  .line-key { margin-top:14px; padding:10px 8px 0; border-top:1px solid var(--panel-border); }
  .line-key-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .line-key-row svg { width:28px; height:8px; flex:0 0 28px; }

  .country { transition: filter .15s ease, opacity .15s ease; cursor:pointer; }
  .country.faded { opacity:0.25; }
  .country.hovered { filter: brightness(1.18); }
  .country.selected { stroke:#ffffff; stroke-width:1.6px; }

  .route { transition: opacity .15s ease, stroke-width .15s ease; cursor:pointer; }
  .route.faded { opacity:0.08 !important; }
  .route.hovered { stroke-width:3.4 !important; }

  .glow { pointer-events:none; }
  .chokepoint { cursor:pointer; }
  .chokepoint:hover { filter: brightness(1.4); }

  .label-text { pointer-events:none; }

  #tooltip {
    position:fixed; z-index:50; pointer-events:none; max-width:300px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 12px; font-size:12.5px; line-height:1.45; color:var(--fg);
    box-shadow:0 6px 24px rgba(0,0,0,0.18); opacity:0; transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
  }
  #tooltip.show { opacity:1; transform:translateY(0); }
  #tooltip .tt-title { font-weight:600; margin-bottom:3px; display:flex; align-items:center; gap:6px; }
  #tooltip .tt-dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:0 0 9px; }
  #tooltip .tt-body { color:var(--sub); }
  #tooltip .tt-body b { color:var(--fg); }

  footer { margin-top:18px; font-size:11.5px; color:var(--sub); max-width:760px; }
</style>
</head>
<body>
<h1>OIL MAP</h1>
<div class="type-toggle" id="typeToggle">
  <button class="type-btn active" data-type="crude">CRUDE</button>
  <button class="type-btn" data-type="refined">REFINED</button>
</div>

<!-- CRUDE view — rendered only by the CRUDE script below -->
<div class="view" id="crudeView">
  <div class="wrap">
    <div class="map-col"><div class="map" id="crudeMap"></div></div>
    <div class="legend" id="crudeLegend"></div>
  </div>
</div>

<!-- REFINED view — rendered only by the REFINED script below -->
<div class="view" id="refinedView" hidden>
  <div class="wrap">
    <div class="map-col"><div class="map" id="refinedMap"></div></div>
    <div class="legend" id="refinedLegend"></div>
  </div>
</div>

<div id="tooltip"></div>

<footer>Data as of ~Sept 2026, see <code>crude.xlsx</code> and <code>refined.xlsx</code> for full sourcing, percentages, and routing notes behind every figure shown here.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
/* ============================================================
   CRUDE / REFINED TOGGLE — the only code shared by both views.
   It just shows one view and hides the other; each view's data and
   rendering live in their own independent script block below.
   ============================================================ */
d3.selectAll('.type-btn').on('click', function(){
  const type = this.dataset.type;
  d3.selectAll('.type-btn').classed('active', false);
  d3.select(this).classed('active', true);
  d3.select('#crudeView').attr('hidden', type === 'crude' ? null : true);
  d3.select('#refinedView').attr('hidden', type === 'refined' ? null : true);
  d3.select('#tooltip').classed('show', false);
});
</script>

<script>

/* ============================================================

/* exports: full destination breakdown of THIS country's crude exports —

function pt(c){ return projection(c); }
function routeColor(d){ return d.group ? groupByKey[d.group].color : '#a3a29c'; }
function curvePath(points, bend){
  const p = points.map(pt);
  let d = 'M'+p[0][0]+','+p[0][1];
  for (let i=1;i<p.length;i++){
    const mx=(p[i-1][0]+p[i][0])/2, my=(p[i-1][1]+p[i][1])/2 - bend;
    d += ' Q'+mx+','+my+' '+p[i][0]+','+p[i][1];
  }
  return d;
}

// ---- tooltip ----
const tooltip = d3.select('#tooltip');
function showTooltip(event, titleHtml, dotColor, bodyHtml){
  tooltip.html(
    '<div class="tt-title">' + (dotColor ? '<span class="tt-dot" style="background:'+dotColor+'"></span>' : '') + titleHtml + '</div>' +
    '<div class="tt-body">' + bodyHtml + '</div>'
  );
  moveTooltip(event);
  tooltip.classed('show', true);
}
function moveTooltip(event){
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ttNode = tooltip.node();
  const w = ttNode.offsetWidth || 240, h = ttNode.offsetHeight || 60;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + w + pad > vw) x = event.clientX - w - pad;
  if (y + h + pad > vh) y = event.clientY - h - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}
function hideTooltip(){ tooltip.classed('show', false); }

function formatStatLine(pct, place){
  return '<b>' + pct + '%</b> ' + place;
}
function formatCountryStats(info){
  const exportsPct = info.exports.reduce((s,e)=>s+e.pct, 0);
  const importsPct = info.imports.reduce((s,e)=>s+e.pct, 0);
  return (
    '<div style="margin-top:4px"><b>Export</b> (' + Math.round(exportsPct) + '%)<br>' +
      info.exports.map(e => formatStatLine(e.pct, e.to)).join('<br>') + '</div>' +
    '<div style="margin-top:4px"><b>Import</b> (' + Math.round(importsPct) + '%)<br>' +
      info.imports.map(e => formatStatLine(e.pct, e.from)).join('<br>') + '</div>'
  );
}

function showEuTooltip(event){
  showTooltip(event, euHub.name, '#e0ded4',
    euHub.note +
    formatCountryStats({exports:[{to:'None',pct:0}], imports:euHub.imports}));
}

// ---- legend state (click to isolate a group) ----
let activeGroup = null;   // null = show all
let activeRoute = null;   // a single clicked arrow; null = none
let activeCountry = null; // a countryInfo name or 'EU'; null = none

// Which clickable "entity" a topology country belongs to (EU members → 'EU').
function entityOf(n){ return euMemberCountries.has(n) ? 'EU' : (countryInfo[n] ? n : null); }
// Click a country: isolate it and every arrow into / out of it. Click it
// again (or the sea, or an untracked country) to reset.
function selectCountry(e){
  activeCountry = (e && activeCountry !== e) ? e : null;
  activeGroup = null;
  activeRoute = null;
  applyFocus();
}

// Click an arrow: isolate it and the countries at its two ends. Click it
// again (or the sea) to reset.
function selectRoute(r){
  activeRoute = (activeRoute === r) ? null : r;
  activeCountry = null;
  activeGroup = null;
  applyFocus();
}

function applyFocus(){
  if (activeRoute){
    const ends = new Set(activeRoute.from.concat(activeRoute.to));
    svg.selectAll('.country')
      .classed('faded', d => !ends.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => ends.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => d !== activeRoute)
      .style('display', d => (d.minor && d !== activeRoute) ? 'none' : null);
    const endKey = activeRoute.pts[activeRoute.pts.length-1].join() + '|' + activeRoute.group;
    svg.selectAll('.glow').style('opacity', d => (d.c.join() + '|' + d.group) === endKey ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeCountry){
    const linked = routes.filter(r => r.from.includes(activeCountry) || r.to.includes(activeCountry));
    const keep = new Set([activeCountry]);
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => entityOf(d.properties && d.properties.name) === activeCountry);
    svg.selectAll('.route').classed('faded', d => !linked.includes(d))
      .style('display', d => (d.minor && !linked.includes(d)) ? 'none' : null);
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  // minor routes: hidden on the overview, shown when their oil type is isolated
  svg.selectAll('.route').style('display', d => (d.minor && d.group !== activeGroup) ? 'none' : null);
  svg.selectAll('.country').classed('selected', false);
  svg.selectAll('.country').classed('faded', function(d){
    if (!activeGroup) return false;
    const n = d.properties && d.properties.name;
    const info = countryInfo[n];
    return !(info && info.group === activeGroup);
  });
  svg.selectAll('.route').classed('faded', d => activeGroup ? d.group !== activeGroup : false);
  svg.selectAll('.glow').classed('faded', d => activeGroup ? d.group !== activeGroup : false)
    .style('opacity', d => (activeGroup ? (d.group === activeGroup ? 0.3 : 0) : 0.22));
  legend.selectAll('.legend-item').classed('dimmed', function(){
    if (!activeGroup) return false;
    return d3.select(this).attr('data-key') !== activeGroup;
  });
}

// ---- legend ----
const legend = d3.select('#crudeLegend');
const legendHeader = legend.append('div').attr('class','legend-header');
legendHeader.append('span').attr('class','legend-title').text('OIL TYPE:');
legendHeader.append('span').attr('class','legend-hint').text('Click a type or a country to isolate it on the map');
legend.selectAll('.legend-item').data(groups).join('div')
  .attr('class','legend-item')
  .attr('data-key', d=>d.key)
  .on('click', function(event, d){
    activeCountry = null;
    activeRoute = null;
    activeGroup = (activeGroup === d.key) ? null : d.key;
    applyFocus();
  })
  .html(d => {
    const swatch = d.hatch
      ? '<span class="sw" style="background:repeating-linear-gradient(45deg,'+d.color+' 0 3px,'+landFill+' 3px 6px)"></span>'
      : '<span class="sw" style="background:'+d.color+'"></span>';
    const benchmarkTag = d.benchmark ? '(' + d.benchmark.toUpperCase() + ') ' : '';
    return swatch + '<span><b>' + d.name + '</b> — ' + benchmarkTag + d.desc + '</span>';
  });

// ---- line-style key (what solid vs dotted routes mean) ----
const lineKey = legend.append('div').attr('class','line-key');
lineKey.append('span').attr('class','legend-title').text('ROUTES:');
lineKey.selectAll('.line-key-row').data([
  {dash:null,  text:'<b>Solid</b> — direct tanker route'},
  {dash:'4 3', text:'<b>Dotted</b> — pipeline / overland, the long way round, or a disrupted flow'}
]).join('div')
  .attr('class','line-key-row')
  .html(d => '<svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#a3a29c" stroke-width="1.7"' +
    (d.dash ? ' stroke-dasharray="'+d.dash+'"' : '') + '/></svg><span>' + d.text + '</span>');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const countries = topojson.feature(world, world.objects.countries).features;

  svg.append('g').selectAll('path').data(countries).join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill', d=>{
      const n = d.properties && d.properties.name;
      if (n==='Canada') return 'url(#canadaStripes)';
      if (n==='Kazakhstan' || n==='North Korea') return 'url(#kazakhstanStripes)';
      if (n==='Brazil' || n==='Mexico') return 'url(#latamStripes)';
      if (n==='Azerbaijan') return 'url(#azerbaijanStripes)';
      if (isImporter(n)) return importFill;
      const info = countryInfo[n];
      return (info && info.group) ? groupByKey[info.group].color : landFill;
    })
    .attr('stroke', d=>{
      const n = d.properties && d.properties.name;
      if (n==='Canada') return '#8a5f00';
      if (n==='Kazakhstan' || n==='North Korea') return '#8a1f1e';
      if (n==='Brazil' || n==='Mexico') return '#0c447c';
      if (n==='Azerbaijan') return '#993556';
      if (isImporter(n)) return importStroke;
      const info = countryInfo[n];
      return (info && info.group) ? groupByKey[info.group].stroke : landStroke;
    })
    .attr('stroke-width',1)
    .on('mouseenter', function(event, d){
      const n = d.properties && d.properties.name;
      d3.select(this).classed('hovered', true);
      if (euMemberCountries.has(n)){
        showEuTooltip(event);
        return;
      }
      const info = countryInfo[n];
      if (info){
        const g = info.group ? groupByKey[info.group] : null;
        showTooltip(event, n === 'United Kingdom' ? 'UK' : n, g ? g.color : '#888780',
          '<b>' + (g ? g.name : 'Importer (not part of a colored group)') + '</b>' +
          (info.note ? '<br>' + info.note : '') +
          formatCountryStats(info));
      } else {
        showTooltip(event, n, null, 'Not part of the tracked crude flows on this map.');
      }
    })
    .on('click', function(event, d){ event.stopPropagation(); selectCountry(entityOf(d.properties && d.properties.name)); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  svg.append('g').selectAll('circle').data(destGlow).join('circle')
    .attr('class','glow')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1])
    .attr('r',20).attr('fill',d=>groupByKey[d.group].color).attr('opacity',0.22).attr('stroke','none');

  svg.append('g').selectAll('path').data(routes).join('path')
    .attr('class','route')
    .attr('d',d=>curvePath(d.pts,d.bend)).attr('fill','none')
    .attr('stroke',routeColor).attr('stroke-width',1.7)
    .attr('stroke-dasharray',d=>d.dash?'4 3':null).attr('opacity',0.95)
    .style('display', d => d.minor ? 'none' : null)
    .attr('marker-end','url(#arrow)')
    .on('mouseenter', function(event, d){
      d3.select(this).classed('hovered', true);
      showTooltip(event, d.label, routeColor(d), d.detail);
    })
    .on('click', (event, d) => { event.stopPropagation(); selectRoute(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  svg.append('g').selectAll('path').data(chokepoints).join('path')
    .attr('class','chokepoint')
    .attr('d',d=>{const p=pt(d.c); return `M${p[0]},${p[1]-5}L${p[0]+5},${p[1]}L${p[0]},${p[1]+5}L${p[0]-5},${p[1]}Z`;})
    .attr('fill','#888780').attr('stroke','#2c2c2a').attr('stroke-width',0.5)
    .on('mouseenter', function(event, d){
      showTooltip(event, d.name, '#888780', d.detail);
    })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  svg.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(euHub.c)[0]).attr('cy', pt(euHub.c)[1]).attr('r', 6)
    .attr('fill','none').attr('stroke','#e0ded4').attr('stroke-width',1.5)
    .on('mouseenter', showEuTooltip)
    .on('click', event => { event.stopPropagation(); selectCountry('EU'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  function label(d){
    const p = pt(d.c);
    svg.append('text').attr('class','label-text').attr('x',p[0]+(d.dx ?? 8)).attr('y',p[1]+d.dy)
      .attr('font-size',11).attr('fill',labelFill).text(d.name);
  }
  originLabels.forEach(label);
  destLabels.forEach(label);
  chokepoints.forEach(d=>label({...d, dy: d.dy ?? -10}));
});
})(); // end CRUDE
</script>

  {pts:[[114,23],[121,14.6]], group:'chn', dash:false, bend:6, from:["China"], to:["Philippines"], label:'China → Philippines', detail:'~12% of China’s product exports.'},

const destGlow = [
  {c:[15,48], group:'usa'},{c:[15,48], group:'ind'},{c:[15,48], group:'gulf'},{c:[15,48], group:'ara'},{c:[15,48], group:'rus'},
  {c:[-100,21], group:'usa'},{c:[-77,-12], group:'usa'},
  {c:[-45,-20], group:'usa'},{c:[-45,-20], group:'rus'},
  {c:[32,39.5], group:'rus'},{c:[35,32.8], group:'rus'},{c:[56.3,25.1], group:'rus'},
  {c:[3.4,6.4], group:'rus'},{c:[3.4,6.4], group:'ara'},
  {c:[39.5,-5], group:'ind'},{c:[39.5,-5], group:'gulf'},
  {c:[103.8,1.35], group:'ind'},{c:[103.8,1.35], group:'chn'},
  {c:[151,-33.9], group:'ind'},{c:[151,-33.9], group:'sgp'},{c:[151,-33.9], group:'kor'},{c:[151,-33.9], group:'chn'},
  {c:[106.8,-6.2], group:'sgp'},{c:[106.7,10.8], group:'sgp'},{c:[106.7,10.8], group:'kor'},
  {c:[139,35.5], group:'gulf'},{c:[139,35.5], group:'kor'},
  {c:[-1,52.5], group:'ara'},{c:[-74,40.5], group:'ara'},{c:[121,14.6], group:'chn'}
];

/* ============================================================
   RENDER
   ============================================================ */
const landFill = '#262623';
const landStroke = '#4a4944';
// Importer countries (group:null in countryInfo) and EU members (minus the
// Netherlands/Belgium, which are the ARA hub here): a slightly lighter gray
// than untracked land, so importers stand out.
const importFill = '#43423e';
const importStroke = '#5e5d57';
function isImporter(n){ return euMemberCountries.has(n) || (countryInfo[n] && !countryInfo[n].group); }
const labelFill = '#f0efec';

// Zoomed in and shifted left: the empty Pacific on the far left is cropped
// so the Middle East / Asia get more room (Hawaii and the far Arctic fall outside).
const projection = d3.geoNaturalEarth1().scale(200).translate([420,270]);
const path = d3.geoPath(projection);
const svg = d3.select('#refinedMap').append('svg')
  .attr('viewBox','0 0 960 500')
  .on('click', () => { activeRoute = null; activeCountry = null; activeGroup = null; applyFocus(); }); // click the sea = reset

svg.append('defs').html(
  '<marker id="refined-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
  '<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>'
);

function pt(c){ return projection(c); }
function curvePath(points, bend){
  const p = points.map(pt);
  let d = 'M'+p[0][0]+','+p[0][1];
  for (let i=1;i<p.length;i++){
    const mx=(p[i-1][0]+p[i][0])/2, my=(p[i-1][1]+p[i][1])/2 - bend;
    d += ' Q'+mx+','+my+' '+p[i][0]+','+p[i][1];
  }
  return d;
}

// ---- tooltip ----
const tooltip = d3.select('#tooltip');
function showTooltip(event, titleHtml, dotColor, bodyHtml){
  tooltip.html(
    '<div class="tt-title">' + (dotColor ? '<span class="tt-dot" style="background:'+dotColor+'"></span>' : '') + titleHtml + '</div>' +
    '<div class="tt-body">' + bodyHtml + '</div>'
  );
  moveTooltip(event);
  tooltip.classed('show', true);
}
function moveTooltip(event){
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ttNode = tooltip.node();
  const w = ttNode.offsetWidth || 240, h = ttNode.offsetHeight || 60;
  let x = event.clientX + pad, y = event.clientY + pad;
  if (x + w + pad > vw) x = event.clientX - w - pad;
  if (y + h + pad > vh) y = event.clientY - h - pad;
  tooltip.style('left', x + 'px').style('top', y + 'px');
}
function hideTooltip(){ tooltip.classed('show', false); }

function formatStatLine(pct, place){
  return '<b>' + pct + '%</b> ' + place;
}
function formatCountryStats(info){
  const exportsPct = info.exports.reduce((s,e)=>s+e.pct, 0);
  const importsPct = info.imports.reduce((s,e)=>s+e.pct, 0);
  return (
    '<div style="margin-top:4px"><b>Export</b> (' + Math.round(exportsPct) + '%)<br>' +
      info.exports.map(e => formatStatLine(e.pct, e.to)).join('<br>') + '</div>' +
    '<div style="margin-top:4px"><b>Import</b> (' + Math.round(importsPct) + '%)<br>' +
      info.imports.map(e => formatStatLine(e.pct, e.from)).join('<br>') + '</div>'
  );
}
function showCountryTooltip(event, name, info){
  const g = info.group ? groupByKey[info.group] : null;
  showTooltip(event, name, g ? g.color : '#888780',
    '<b>' + (g ? g.name : 'Importer (not part of a colored group)') + '</b>' +
    (info.note ? '<br>' + info.note : '') +
    formatCountryStats(info));
}
function showEuTooltip(event){
  showTooltip(event, euHub.name, '#e0ded4', euHub.note + formatCountryStats(euHub));
}

// ---- legend state (click to isolate a group) ----
let activeGroup = null;   // null = show all
let activeRoute = null;   // a single clicked arrow; null = none
let activeCountry = null; // a countryInfo name, 'EU' or 'Singapore'; null = none

// Which clickable "entity" a topology country belongs to (EU members → 'EU').
function entityOf(n){ return euMemberCountries.has(n) ? 'EU' : (countryInfo[n] ? n : null); }
// Click a country: isolate it and every arrow into / out of it. Click it
// again (or the sea, or an untracked country) to reset.
function selectCountry(e){
  activeCountry = (e && activeCountry !== e) ? e : null;
  activeGroup = null;
  activeRoute = null;
  applyFocus();
}

// Click an arrow: isolate it and the countries at its two ends. Click it
// again (or the sea) to reset.
function selectRoute(r){
  activeRoute = (activeRoute === r) ? null : r;
  activeCountry = null;
  activeGroup = null;
  applyFocus();
}

function applyFocus(){
  if (activeRoute){
    const ends = new Set(activeRoute.from.concat(activeRoute.to));
    svg.selectAll('.country')
      .classed('faded', d => !ends.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => ends.has(entityOf(d.properties && d.properties.name)));
    svg.selectAll('.route').classed('faded', d => d !== activeRoute)
      .style('display', d => (d.minor && d !== activeRoute) ? 'none' : null);
    const endKey = activeRoute.pts[activeRoute.pts.length-1].join() + '|' + activeRoute.group;
    svg.selectAll('.glow').style('opacity', d => (d.c.join() + '|' + d.group) === endKey ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  if (activeCountry){
    const linked = routes.filter(r => r.from.includes(activeCountry) || r.to.includes(activeCountry));
    const keep = new Set([activeCountry]);
    linked.forEach(r => r.from.concat(r.to).forEach(e => keep.add(e)));
    const ends = new Set(linked.map(r => r.pts[r.pts.length-1].join() + '|' + r.group));
    svg.selectAll('.country')
      .classed('faded', d => !keep.has(entityOf(d.properties && d.properties.name)))
      .classed('selected', d => entityOf(d.properties && d.properties.name) === activeCountry);
    svg.selectAll('.route').classed('faded', d => !linked.includes(d));
    svg.selectAll('.glow').style('opacity', d => ends.has(d.c.join() + '|' + d.group) ? 0.3 : 0);
    legend.selectAll('.legend-item').classed('dimmed', false);
    return;
  }
  svg.selectAll('.country').classed('selected', false);
  svg.selectAll('.country').classed('faded', function(d){
    if (!activeGroup) return false;
    const info = countryInfo[d.properties && d.properties.name];
    return !(info && info.group === activeGroup);
  });
  svg.selectAll('.route').classed('faded', d => activeGroup ? d.group !== activeGroup : false);
  svg.selectAll('.glow').style('opacity', d => (activeGroup ? (d.group === activeGroup ? 0.3 : 0) : 0.22));
  legend.selectAll('.legend-item').classed('dimmed', function(){
    if (!activeGroup) return false;
    return d3.select(this).attr('data-key') !== activeGroup;
  });
}

// ---- legend ----
const legend = d3.select('#refinedLegend');
const legendHeader = legend.append('div').attr('class','legend-header');
legendHeader.append('span').attr('class','legend-title').text('EXPORTER / HUB:');
legendHeader.append('span').attr('class','legend-hint').text('Click a type or a country to isolate it on the map');
legend.selectAll('.legend-item').data(groups).join('div')
  .attr('class','legend-item')
  .attr('data-key', d=>d.key)
  .on('click', function(event, d){
    activeCountry = null;
    activeRoute = null;
    activeGroup = (activeGroup === d.key) ? null : d.key;
    applyFocus();
  })
  .html(d => '<span class="sw" style="background:'+d.color+'"></span><span><b>' + d.name + '</b> — ' + d.desc + '</span>');

// ---- line-style key (what solid vs dotted routes mean) ----
const lineKey = legend.append('div').attr('class','line-key');
lineKey.append('span').attr('class','legend-title').text('ROUTES:');
lineKey.selectAll('.line-key-row').data([
  {dash:null,  text:'<b>Solid</b> — direct tanker route'},
  {dash:'4 3', text:'<b>Dotted</b> — indirect flow (re-export, blending / transshipment) or inland barge / pipeline'}
]).join('div')
  .attr('class','line-key-row')
  .html(d => '<svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#a3a29c" stroke-width="1.7"' +
    (d.dash ? ' stroke-dasharray="'+d.dash+'"' : '') + '/></svg><span>' + d.text + '</span>');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const countries = topojson.feature(world, world.objects.countries).features;

  svg.append('g').selectAll('path').data(countries).join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill', d=>{
      if (isImporter(d.properties && d.properties.name)) return importFill;
      const info = countryInfo[d.properties && d.properties.name];
      return (info && info.group) ? groupByKey[info.group].color : landFill;
    })
    .attr('stroke', d=>{
      if (isImporter(d.properties && d.properties.name)) return importStroke;
      const info = countryInfo[d.properties && d.properties.name];
      return (info && info.group) ? groupByKey[info.group].stroke : landStroke;
    })
    .attr('stroke-width',1)
    .on('mouseenter', function(event, d){
      const n = d.properties && d.properties.name;
      d3.select(this).classed('hovered', true);
      if (euMemberCountries.has(n)){ showEuTooltip(event); return; }
      const info = countryInfo[n];
      if (info) showCountryTooltip(event, n === 'United Kingdom' ? 'UK' : n, info);
      else showTooltip(event, n, null, 'Not part of the tracked refined-product flows on this map.');
    })
    .on('click', function(event, d){ event.stopPropagation(); selectCountry(entityOf(d.properties && d.properties.name)); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  svg.append('g').selectAll('circle').data(destGlow).join('circle')
    .attr('class','glow')
    .attr('cx',d=>pt(d.c)[0]).attr('cy',d=>pt(d.c)[1])
    .attr('r',16).attr('fill',d=>groupByKey[d.group].color).attr('opacity',0.22).attr('stroke','none');

  svg.append('g').selectAll('path').data(routes).join('path')
    .attr('class','route')
    .attr('d',d=>curvePath(d.pts,d.bend)).attr('fill','none')
    .attr('stroke',d=>groupByKey[d.group].color).attr('stroke-width',1.7)
    .attr('stroke-dasharray',d=>d.dash?'4 3':null).attr('opacity',0.95)
    .attr('marker-end','url(#refined-arrow)')
    .on('mouseenter', function(event, d){
      d3.select(this).classed('hovered', true);
      showTooltip(event, d.label, groupByKey[d.group].color, d.detail);
    })
    .on('click', (event, d) => { event.stopPropagation(); selectRoute(d); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', function(){ d3.select(this).classed('hovered', false); hideTooltip(); });

  svg.append('g').selectAll('path').data(chokepoints).join('path')
    .attr('class','chokepoint')
    .attr('d',d=>{const p=pt(d.c); return `M${p[0]},${p[1]-5}L${p[0]+5},${p[1]}L${p[0]},${p[1]+5}L${p[0]-5},${p[1]}Z`;})
    .attr('fill','#888780').attr('stroke','#2c2c2a').attr('stroke-width',0.5)
    .on('mouseenter', function(event, d){ showTooltip(event, d.name, '#888780', d.detail); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  // EU hub marker
  svg.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(euHub.c)[0]).attr('cy', pt(euHub.c)[1]).attr('r', 6)
    .attr('fill','none').attr('stroke','#e0ded4').attr('stroke-width',1.5)
    .on('mouseenter', showEuTooltip)
    .on('click', event => { event.stopPropagation(); selectCountry('EU'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  // Singapore hub marker (not a polygon at 110m resolution)
  svg.append('circle')
    .attr('class','chokepoint')
    .attr('cx', pt(singaporeHub.c)[0]).attr('cy', pt(singaporeHub.c)[1]).attr('r', 5)
    .attr('fill', groupByKey.sgp.color).attr('stroke','#e0ded4').attr('stroke-width',1.2)
    .on('mouseenter', event => showCountryTooltip(event, singaporeHub.name, countryInfo['Singapore']))
    .on('click', event => { event.stopPropagation(); selectCountry('Singapore'); })
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  function label(d){
    const p = pt(d.c);
    svg.append('text').attr('class','label-text').attr('x',p[0]+(d.dx ?? 8)).attr('y',p[1]+d.dy)
      .attr('font-size',11).attr('fill',labelFill).text(d.name);
  }
  originLabels.forEach(label);
  destLabels.forEach(label);
  chokepoints.forEach(d=>label({...d, dy: d.dy ?? -10}));
});
})(); // end REFINED
</script>
