u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed \u002f US inflation:\u003c\u002fb\u003e Soft US payrolls fuel dovish Fed-cut bets \u2014 global bond rally.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Cooling German & French inflation adds to the rate-cut mood.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks above 102.23 resistance on the tailwind.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e16 Jan 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Strong auction demand; BTP-Bund spread ~59bps, lowest in years \u2014 rally extends to fresh highs.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Benign US CPI keeps the March Fed cut scenario alive.\u003cbr\u003e\u003ci\u003eSource: mef.gov.it \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e23 Jan 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Schnabel & Simkus flag 'no need for cuts' \u2014 2026 cut bets trimmed, BTP pulls back below 103.71\u002f104.47.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Waller pushes back on early-cut pricing ahead of the FOMC blackout.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e30 Jan 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Jan 27-28) holds; Powell says 'no rush' to cut \u2014 March odds fade.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Month-end profit-taking; BTP consolidates just below the highs.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e06 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\u2194\ufe0f \u003cb\u003eMarkets:\u003c\u002fb\u003e Quiet, range-bound week \u2014 no major catalyst, yields drift sideways.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Mixed US payrolls keep the Fed debate unresolved.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e13 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Cool US CPI revives Fed-cut optimism \u2014 Treasuries rally, BTP follows.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP reclaims 103.71 resistance ahead of the pre-war rally.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e20 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP extends the rally, breaks above 104.47 \u2014 yields near multi-month lows.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC minutes lean dovish; June cut fully priced.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Gulf tensions simmer in the background \u2014 days before the war erupts.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e27 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e US-Israel launch military action against Iran (Feb 27-28) \u2014 BTP still riding pre-war highs.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Trump orders the strikes after failed nuclear talks \u2014 oil spikes late Friday.\u003cbr\u003e\u003ci\u003eSource: cnbc.com\u003c\u002fi\u003e","\u003cb\u003e06 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Strait of Hormuz shut; oil spikes \u2014 BTP crashes through 104.47 & 103.71.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed-cut bets evaporate as US inflation breakevens surge \u2014 Treasury yields jump.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e First ECB hike chatter as energy-driven inflation fears ignite.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e13 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US CPI + oil above $100 \u2014 markets flip to pricing Fed HIKES; global yields surge.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Iran hits Gulf energy infrastructure; Hormuz stays shut.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks 102.23 and the 101.05 pivot.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e20 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Mar 17-18): Powell puts hikes 'back on the table'; dots shift hawkish \u2014 Treasuries sell off hard.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Lagarde warns of a prolonged energy shock; markets price 3 ECB hikes.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP smashes through 99.40; yields hit ~4.1%, a 20-month high.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e27 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Lagarde tells The Economist a quick recovery is 'overly optimistic' \u2014 lost Gulf supply could take years to restore.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Core PCE comes in hot; stagflation talk dominates.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP hits its low of the year (96.60).\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bea.gov\u003c\u002fi\u003e","\u003cb\u003e03 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Reports Trump could halt Iran strikes despite Hormuz staying blocked \u2014 relief rally.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP reclaims the 97.39\u002f98.36 zone.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Soft US payrolls cool the hike panic at the margin.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e10 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Fragile ceasefire (struck Apr 8) already shows cracks \u2014 Iran claims violations; Hormuz traffic restricted.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed speakers split between 'transitory oil shock' and hike camp \u2014 Treasuries whipsaw.\u003cbr\u003e\u003ci\u003eSource: mexc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e17 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Iran declares Hormuz 'completely open' during the ceasefire \u2014 oil plunges ~12%.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e US CPI peak fears ease as oil retreats; hike odds trimmed.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP holds gains above 99.40.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e24 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\u2194\ufe0f \u003cb\u003eMarkets:\u003c\u002fb\u003e Ceasefire holding but shaky; consolidation as Hormuz shipping stays only partially restored.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed speakers non-committal into the FOMC blackout.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e01 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Apr 28-29) holds; Powell calls the oil-driven inflation spike 'containable if the ceasefire holds'.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP trades a tight range with oil stabilizing in the $90s.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e08 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Oil grinding lower on de-escalation \u2014 late-2026 Fed cut bets creep back in, Treasuries bid.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Solid BTP auction demand gives a modest bid.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 mef.gov.it\u003c\u002fi\u003e","\u003cb\u003e15 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Brief flare-up in Gulf tensions dents sentiment \u2014 BTP dips back toward support.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US PPI print adds to the wobble.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e22 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Oil down sharply from its peak on optimism over a lasting US-Iran ceasefire.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks back above the 98.36\u002f99.40 zone.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e ECB hawks push back: 'one good month of oil is not disinflation'.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 ecb.europa.eu\u003c\u002fi\u003e","\u003cb\u003e29 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Brent -19% in May (worst month since Covid) as US-Iran 'mostly agree' a 60-day ceasefire MOU; Kuwait strikes continue.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Core PCE cools \u2014 Treasury rally supports BTP.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bea.gov\u003c\u002fi\u003e","\u003cb\u003e05 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Markets brace for the Jun 11 meeting \u2014 first hike since 2023 (to 2.25%) widely expected.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Solid US payrolls keep the Fed on hold \u2014 no help from Treasuries.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP dips below the 101.05 pivot pre-decision.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e12 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Day after the ECB's first hike since 2023 (to 2.25%, effective Jun 17) \u2014 yields reset to the new rate path.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e US CPI surprises to the upside; Fed hike tail-risk returns \u2014 global yields firm.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e19 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Israel and Iran-backed Hezbollah agree a ceasefire; 12M+ barrels of tankers cross Hormuz overnight without incident.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Jun 16-17) holds; dot plot shows NO cuts in 2026 \u2014 a hawkish hold.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Vance publicly confirms the Hormuz transit \u2014 de-escalation signal.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e26 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Powell testimony: 'prepared to act' if oil inflation persists, but sees relief in the data \u2014 Treasuries rally.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Relief extends as Hormuz normalizes \u2014 BTP reclaims the 101-102 zone.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 cnbc.com\u003c\u002fi\u003e","\u003cb\u003e03 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed \u002f US data:\u003c\u002fb\u003e Strong US payrolls push Treasury yields up \u2014 BTP follows, slipping back below 102.23.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Sintra forum: Lagarde keeps a hawkish tone, September 'live'.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 ecb.europa.eu\u003c\u002fi\u003e","\u003cb\u003e10 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Renewed US-Iran strikes reignite Hormuz tensions; oil jumps.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Hawkish FOMC minutes compound the move \u2014 hike odds firm on both sides of the Atlantic.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks below the 101.05 pivot.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e17 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Conflict flares anew \u2014 BTP breaks below 99.40 into ECB decision week.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US CPI lifts yields globally; Fed July cut ruled out.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Bundesbank's Nagel warns of an 'extremely volatile' outlook.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e24 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e ECB holds at 2.25% (Jul 23) as expected, but Lagarde's tone is hawkish-leaning \u2014 10 Sept meeting kept live. BTP dips to 97.19, then rebounds hard Friday +1.04% to close at 98.20.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Mediators float a 10-day ceasefire proposal \u2014 the Friday bounce rides the relief trade.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e All eyes turn to the FOMC (Jul 28-29) \u2014 a hold is priced, but the statement's oil-inflation language is the risk.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e31 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC week (Jul 28-29) \u2014 hold priced; Monday BTP extends the relief rally +0.36% to 98.55 as ceasefire optimism builds into the decision.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e 10-day ceasefire proposal still on the table \u2014 Hormuz risk premium bleeding out of oil.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e post-hold digestion; hawkish-leaning Lagarde caps the upside near the 99.40 support-turned-resistance.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 cnbc.com\u003c\u002fi\u003e"],"mode":"text","name":"Macro events","showlegend":true,"text":["\ud83c\uddee\ud83c\uddf9","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf9","\ud83c\uddea\ud83c\uddfa","\ud83c\uddfa\ud83c\uddf8","\u2194\ufe0f","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf9","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddea\ud83c\uddfa","\u26a0\ufe0f","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\u2194\ufe0f","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ r\u003e\u003cb\u003eWeek 1 \u2014 Ceasefire lands, FOMC digested\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e base case \u2014 the 10-day truce is accepted, Hormuz partially normalizes, oil drops further.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e post-FOMC drift; falling oil lets cut bets creep back into the Treasury curve \u2014 tailwind for a test of the 99.40 level.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Trump's retaliation pledge could still kill the deal.\u003cbr\u003e\u003ci\u003eBias: bullish \u2014 momentum from the two-day +1.4% rebound carries.\u003c\u002fi\u003e","\u003cb\u003e14 Aug 2026 \u2014 FORECAST\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eWeek 2 \u2014 Truce credibility tested, US CPI lands\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e every ceasefire this year (8 Apr, 19 Jun) broke within weeks \u2014 a 10-day truce expires fast.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e July CPI (mid-Aug) is the swing factor \u2014 an oil-driven hot print revives Fed-hike pricing.\u003cbr\u003e\u003ci\u003eBias: fade the rally at 99.40 resistance. Pattern: repeated truce-break cycles YTD.\u003c\u002fi\u003e","\u003cb\u003e21 Aug 2026 \u2014 FORECAST\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eWeek 3 \u2014 Fade into the September central-bank gauntlet\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e truce lapses or frays; Houthi blockade threat on Saudi opens a second front.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e markets start pricing the 10 Sept projection meeting, where another hike is live.\u003cbr\u003e\u003ci\u003eBias: bearish \u2014 back below the 98.36 pivot.\u003c\u002fi\u003e","\u003cb\u003e28 Aug 2026 \u2014 FORECAST\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eWeek 4 \u2014 Jackson Hole\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Powell at Jackson Hole (late Aug) ahead of the 15-16 Sept FOMC \u2014 hawkish oil-inflation framing is the risk that resets the curve.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Sept-hike pricing firms in sympathy.\u003cbr\u003e\u003ci\u003eBias: bearish \u2014 drift toward the 96.60 YTD low. Watch: Hormuz transits, Brent above $95.\u003c\u002fi\u003e"],"mode":"text","name":"Forecast drivers","showlegend":true,"text":["\ud83c\uddee\ud83c\uddf7","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddea\ud83c\uddfa","\ud83c\uddfa\ud83c\uddf8"],"textfont":{"size":20},"x":["2026-08-07T00:00:00","2026-08-14T00:00:00","2026-08-21T00:00:00","2026-08-28T00:00:00"],"y":[100.30000000000001,100.55000000000001,99.9,99.30000000000001],"type":"scatter"}],                        {"template":{"data":{"barpolar":[{"marker":{"line":{"color":"rgb(17,17,17)","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"barpolar"}],"bar":[{"error_x":{"color":"#f2f5fa"},"error_y":{"color":"#f2f5fa"},"marker":{"line":{"color":"rgb(17,17,17)","width":0.5},"pattern":{"fillmode":"overlay","size":10,"solidity":0.2}},"type":"bar"}],"carpet":[{"aaxis":{"endlinecolor":"#A2B1C6","gridcolor":"#506784","linecolor":"#506784","minorgridcolor":"#506784","startlinecolor":"#A2B1C6"},"baxis":{"endlinecolor":"#A2B1C6","gridcolor":"#506784","linecolor":"#506784","minorgridcolor":"#506784","startlinecolor":"#A2B1C6"},"type":"carpet"}],"choropleth":[{"colorbar":{"outlinewidth":0,"ticks":""},"type":"choropleth"}],"contourcarpet":[{"colorbar":{"outlinewidth":0,"ticks":""},"type":"contourcarpet"}],"contour":[{"colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0
