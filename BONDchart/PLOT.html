\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Month-end profit-taking; BTP consolidates just below the highs.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e06 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\u2194\ufe0f \u003cb\u003eMarkets:\u003c\u002fb\u003e Quiet, range-bound week \u2014 no major catalyst, yields drift sideways.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Mixed US payrolls keep the Fed debate unresolved.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e13 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Cool US CPI revives Fed-cut optimism \u2014 Treasuries rally, BTP follows.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP reclaims 103.71 resistance ahead of the pre-war rally.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e20 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP extends the rally, breaks above 104.47 \u2014 yields near multi-month lows.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC minutes lean dovish; June cut fully priced.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Gulf tensions simmer in the background \u2014 days before the war erupts.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e27 Feb 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e US-Israel launch military action against Iran (Feb 27-28) \u2014 BTP still riding pre-war highs.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Trump orders the strikes after failed nuclear talks \u2014 oil spikes late Friday.\u003cbr\u003e\u003ci\u003eSource: cnbc.com\u003c\u002fi\u003e","\u003cb\u003e06 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Strait of Hormuz shut; oil spikes \u2014 BTP crashes through 104.47 & 103.71.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed-cut bets evaporate as US inflation breakevens surge \u2014 Treasury yields jump.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e First ECB hike chatter as energy-driven inflation fears ignite.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e13 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US CPI + oil above $100 \u2014 markets flip to pricing Fed HIKES; global yields surge.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Iran hits Gulf energy infrastructure; Hormuz stays shut.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks 102.23 and the 101.05 pivot.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e20 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Mar 17-18): Powell puts hikes 'back on the table'; dots shift hawkish \u2014 Treasuries sell off hard.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Lagarde warns of a prolonged energy shock; markets price 3 ECB hikes.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP smashes through 99.40; yields hit ~4.1%, a 20-month high.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e27 Mar 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Lagarde tells The Economist a quick recovery is 'overly optimistic' \u2014 lost Gulf supply could take years to restore.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Core PCE comes in hot; stagflation talk dominates.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP hits its low of the year (96.60).\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bea.gov\u003c\u002fi\u003e","\u003cb\u003e03 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Reports Trump could halt Iran strikes despite Hormuz staying blocked \u2014 relief rally.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP reclaims the 97.39\u002f98.36 zone.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Soft US payrolls cool the hike panic at the margin.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e10 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Fragile ceasefire (struck Apr 8) already shows cracks \u2014 Iran claims violations; Hormuz traffic restricted.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed speakers split between 'transitory oil shock' and hike camp \u2014 Treasuries whipsaw.\u003cbr\u003e\u003ci\u003eSource: mexc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e17 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Iran declares Hormuz 'completely open' during the ceasefire \u2014 oil plunges ~12%.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e US CPI peak fears ease as oil retreats; hike odds trimmed.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP holds gains above 99.40.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e24 Apr 2026\u003c\u002fb\u003e\u003cbr\u003e\u2194\ufe0f \u003cb\u003eMarkets:\u003c\u002fb\u003e Ceasefire holding but shaky; consolidation as Hormuz shipping stays only partially restored.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Fed speakers non-committal into the FOMC blackout.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com\u003c\u002fi\u003e","\u003cb\u003e01 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Apr 28-29) holds; Powell calls the oil-driven inflation spike 'containable if the ceasefire holds'.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP trades a tight range with oil stabilizing in the $90s.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e08 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Oil grinding lower on de-escalation \u2014 late-2026 Fed cut bets creep back in, Treasuries bid.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Solid BTP auction demand gives a modest bid.\u003cbr\u003e\u003ci\u003eSource: tradingeconomics.com \u00b7 mef.gov.it\u003c\u002fi\u003e","\u003cb\u003e15 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Brief flare-up in Gulf tensions dents sentiment \u2014 BTP dips back toward support.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US PPI print adds to the wobble.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e22 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Oil down sharply from its peak on optimism over a lasting US-Iran ceasefire.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks back above the 98.36\u002f99.40 zone.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e ECB hawks push back: 'one good month of oil is not disinflation'.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 ecb.europa.eu\u003c\u002fi\u003e","\u003cb\u003e29 May 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Brent -19% in May (worst month since Covid) as US-Iran 'mostly agree' a 60-day ceasefire MOU; Kuwait strikes continue.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Core PCE cools \u2014 Treasury rally supports BTP.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bea.gov\u003c\u002fi\u003e","\u003cb\u003e05 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Markets brace for the Jun 11 meeting \u2014 first hike since 2023 (to 2.25%) widely expected.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Solid US payrolls keep the Fed on hold \u2014 no help from Treasuries.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP dips below the 101.05 pivot pre-decision.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e12 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Day after the ECB's first hike since 2023 (to 2.25%, effective Jun 17) \u2014 yields reset to the new rate path.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e US CPI surprises to the upside; Fed hike tail-risk returns \u2014 global yields firm.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e19 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Israel and Iran-backed Hezbollah agree a ceasefire; 12M+ barrels of tankers cross Hormuz overnight without incident.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC (Jun 16-17) holds; dot plot shows NO cuts in 2026 \u2014 a hawkish hold.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Vance publicly confirms the Hormuz transit \u2014 de-escalation signal.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e26 Jun 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Powell testimony: 'prepared to act' if oil inflation persists, but sees relief in the data \u2014 Treasuries rally.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e Relief extends as Hormuz normalizes \u2014 BTP reclaims the 101-102 zone.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 cnbc.com\u003c\u002fi\u003e","\u003cb\u003e03 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed \u002f US data:\u003c\u002fb\u003e Strong US payrolls push Treasury yields up \u2014 BTP follows, slipping back below 102.23.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Sintra forum: Lagarde keeps a hawkish tone, September 'live'.\u003cbr\u003e\u003ci\u003eSource: bls.gov \u00b7 ecb.europa.eu\u003c\u002fi\u003e","\u003cb\u003e10 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Renewed US-Iran strikes reignite Hormuz tensions; oil jumps.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e Hawkish FOMC minutes compound the move \u2014 hike odds firm on both sides of the Atlantic.\u003cbr\u003e\ud83c\uddee\ud83c\uddf9 \u003cb\u003eItaly:\u003c\u002fb\u003e BTP breaks below the 101.05 pivot.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e17 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Conflict flares anew \u2014 BTP breaks below 99.40 into ECB decision week.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eUS inflation:\u003c\u002fb\u003e Hot US CPI lifts yields globally; Fed July cut ruled out.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Bundesbank's Nagel warns of an 'extremely volatile' outlook.\u003cbr\u003e\u003ci\u003eSource: cnbc.com \u00b7 bls.gov\u003c\u002fi\u003e","\u003cb\u003e24 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e ECB holds at 2.25% (Jul 23) as expected, but Lagarde's tone is hawkish-leaning \u2014 10 Sept meeting kept live. BTP dips to 97.19, then rebounds hard Friday +1.04% to close at 98.20.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e Mediators float a 10-day ceasefire proposal \u2014 the Friday bounce rides the relief trade.\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e All eyes turn to the FOMC (Jul 28-29) \u2014 a hold is priced, but the statement's oil-inflation language is the risk.\u003cbr\u003e\u003ci\u003eSource: ecb.europa.eu \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e31 Jul 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC holds (Jul 29) but flags oil-driven inflation risk and Powell refuses to rule out a hike \u2014 the relief rally unwinds all week: BTP slides from 98.78 (Tue) to 97.18 by Friday (-1.04% w\u002fw), closing below the 97.33 support.\u003cbr\u003e\ud83c\uddee\ud83c\uddf7 \u003cb\u003eIran:\u003c\u002fb\u003e the 10-day ceasefire proposal is still unsigned into the weekend \u2014 the relief premium has fully bled out.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e the hawkish Fed keeps 10 Sept ECB-hike pricing firm; below 97.33 there is little support before the 96.60 YTD low.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 cnbc.com\u003c\u002fi\u003e","\u003cb\u003e07 Aug 2026\u003c\u002fb\u003e\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e US midterm election cycle ramps up \u2014 Powell's comments on rate hikes spark debate, but the BTP's rally remains focused on oil dynamics and ceasefire relief.\u003cbr\u003e\u003ci\u003eSource: bloomberg.com \u00b7 federalreserve.gov\u003c\u002fi\u003e","\u003cb\u003e14 Aug 2026\u003c\u002fb\u003e\u003cbr\u003e\ud83c\uddfa\ud83c\uddf8 \u003cb\u003eFed:\u003c\u002fb\u003e FOMC holds (Aug 10-11) but emphasizes 'persistent inflation risks' and signals no near-term rate cuts \u2014 the BTP slides from 98.51 (Mon) to 97.33 (Fri), testing the 97.91 support level.\u003cbr\u003e\ud83c\uddea\ud83c\uddfa \u003cb\u003eECB:\u003c\u002fb\u003e Bundesbank's Nagel reiterates 'extreme volatility' warnings, reinforcing hawkish 10 Sept hike pricing; BTP struggles to find traction above 97.91.\u003cbr\u003e\u26a0\ufe0f \u003cb\u003eUS politics:\u003c\u002fb\u003e Midterm election tensions intensify; Powell's dovish hints are overshadowed by inflation data, pressuring bond yields globally.\u003cbr\u003e\u003ci\u003eSource: federalreserve.gov \u00b7 ecb.europa.eu \u00b7 bloomberg.com\u003c\u002fi\u003e"],"mode":"text","name":"Macro events","showlegend":true,"text":["\ud83c\uddee\ud83c\uddf9","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf9","\ud83c\uddea\ud83c\uddfa","\ud83c\uddfa\ud83c\uddf8","\u2194\ufe0f","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf9","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddea\ud83c\uddfa","\u26a0\ufe0f","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\u2194\ufe0f","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ud83c\uddea\ud83c\uddfa","\ud83c\uddea\ud83c\uddfa","\ud83c\uddee\ud83c\uddf7","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddfa\ud83c\uddf8","\ud83c\uddee\ud83c\uddf7","\ud83c\uddee\ud83c\uddf7","\ud83c\uddea\ud83c\uddfa","\ud83c\uddfa\ud83c\uddf8","\u26a0\ufe0f","\ud83c <style>
#wd-toggle {
  position: fixed; top: 10px; left: 14px; z-index: 999;
  display: flex; align-items: center; gap: 7px;
  font: 11px sans-serif; color: #8a8d98; user-select: none; cursor: pointer;
}
#wd-toggle .lbl.on { color: #eaeaea; font-weight: 600; }
#wd-track {
  width: 30px; height: 16px; border-radius: 8px;
  background: #2b2d38; position: relative; transition: background .15s;
}
#wd-knob {
  width: 12px; height: 12px; border-radius: 50%; background: #5dade2;
  position: absolute; top: 2px; left: 2px; transition: left .15s;
}
#wd-toggle.daily #wd-knob { left: 16px; }
</style>
<div id="wd-toggle">
  <span class="lbl on" id="wd-w">W</span>
  <div id="wd-track"><div id="wd-knob"></div></div>
  <span class="lbl" id="wd-d">D</span>
</div>
<script>
(function () {
  var el = document.getElementById('wd-toggle'), daily = false;
  el.addEventListener('click', function () {
    daily = !daily;
    el.classList.toggle('daily', daily);
    document.getElementById('wd-w').classList.toggle('on', !daily);
    document.getElementById('wd-d').classList.toggle('on', daily);
    Plotly.restyle('chart',
      {visible: daily ? [false, true, false, true] : [true, false, true, false]},
      [0, 1, 3, 4]);
  });
})();
</script>
